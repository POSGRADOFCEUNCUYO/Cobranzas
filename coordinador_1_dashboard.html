<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Coordinador</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Inter','DM Sans',system-ui,sans-serif; background: #F8F6F1; color: #1C1510; font-size: 14px; -webkit-font-smoothing: antialiased; }

        /* ── HEADER ── */
        .header { background: linear-gradient(135deg,#5C1018 0%,#8C1A28 100%); border-bottom: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-main { max-width: 1400px; margin: 0 auto; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .header-left h1 { font-family: 'Crimson Pro',Georgia,serif; font-size: 24px; font-weight: 700; color: #fff; line-height: 1.15; }
        .header-left p { font-size: 12.5px; color: rgba(255,255,255,0.8); margin-top: 1px; }
        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .icon-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 12px; font-size: 17px; border-radius: 8px; cursor: pointer; position: relative; transition: .15s; }
        .icon-btn:hover { background: rgba(255,255,255,0.28); }
        .logout-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; font-family: inherit; transition: .15s; }
        .logout-btn:hover { background: rgba(255,255,255,0.28); }
        .notif-badge { position: absolute; top: -4px; right: -4px; background: var(--clr-danger); color: #fff; border-radius: 50%; min-width: 17px; height: 17px; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px; border: 2px solid #fff; }
        .notif-panel { display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 320px; background: #fff; border-radius: 14px; box-shadow: 0 8px 32px rgba(10,15,30,.14); z-index: 500; overflow: hidden; color: #1C1510; border: 1px solid #EFEAE0; }
        .notif-panel.open { display: block; }
        .notif-head { padding: 14px 16px; border-bottom: 1px solid #EFEAE0; font-weight: 700; color: #5C1018; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .notif-head button { background: none; border: none; color: #C49A2A; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .notif-item { padding: 12px 16px; border-bottom: 1px solid #F8F6F1; font-size: 13px; cursor: pointer; background: #fff; transition: background .1s; color: #000; }
        .notif-item:hover { background: #F8F6F1; }
        .notif-item.unread { background: #FBF4E3; }
        .notif-item:last-child { border-bottom: none; }
        .notif-item strong { display: block; color: #000; margin-bottom: 2px; font-size: 13px; }
        .notif-item small { color: #000; font-size: 11.5px; margin-top: 2px; display: block; }

        /* Stats bar */
        .hstats-bar { max-width: 1400px; margin: 0 auto; padding: 8px 28px 12px; display: flex; gap: 6px 28px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.15); background: transparent; }
        .hstat { display: flex; flex-direction: column; align-items: flex-start; }
        .hstat-sep { padding-left: 28px; border-left: 1px solid rgba(255,255,255,.25); }
        .hstat-lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,0.75); margin-bottom: 1px; }
        .hstat-val { font-family: 'Crimson Pro',Georgia,serif; font-size: 20px; font-weight: 700; color: #fff; line-height: 1.1; }

        /* ── CONTENIDO ── */
        .container { width: 100%; padding: 24px 28px 48px; box-sizing: border-box; }
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgba(10,15,30,.06), 0 4px 16px rgba(10,15,30,.04); border: 1px solid #EFEAE0; }

        /* Tabs */
        .tabs-bar { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 7px 16px; border: 1.5px solid #E6DFD2; border-radius: 99px; background: #fff; font-size: 12.5px; font-weight: 600; color: #594F42; cursor: pointer; font-family: inherit; transition: .15s; }
        .tab-btn:hover { border-color: #5C1018; color: #5C1018; background: #F6EAEB; }
        .tab-btn.active { border-color: #5C1018; background: #5C1018; color: #fff; }
        .tab-btn.accent { border-color: #C49A2A; color: #5C1018; background: #fff; }
        .tab-btn.accent:hover { background: #FBF4E3; }

        /* Cohorte/programa items */
        .items-list { display: flex; flex-direction: column; gap: 10px; }
        .cohorte-item { padding: 15px 18px; background: #F8F6F1; border-radius: 12px; cursor: pointer; transition: all .18s; border: 1.5px solid transparent; }
        .cohorte-item:hover { border-color: #C49A2A; background: #FBF4E3; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(10,15,30,.07); }
        .ci-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 7px; }
        .ci-name { font-weight: 700; color: #5C1018; font-size: 14px; line-height: 1.35; }
        .ci-program { font-size: 11.5px; color: #6B6254; margin-top: 2px; }
        .ci-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .ci-badge.activa { background: #d1fae5; color: #065f46; }
        .ci-badge.cerrada { background: #F8F6F1; color: #6B6254; border: 1px solid #E6DFD2; }
        .ci-stats { display: flex; gap: 14px; font-size: 12px; color: #594F42; flex-wrap: wrap; }
        .ci-stats span { display: flex; align-items: center; gap: 3px; }
        .ci-dates { margin-top: 5px; font-size: 11px; color: #6B6254; }

        /* Acciones rápidas */
        .card-title { font-family: 'Crimson Pro',Georgia,serif; font-size: 21px; font-weight: 700; color: #5C1018; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #EFEAE0; }
        .quick-actions { display: flex; flex-direction: column; gap: 8px; }
        .action-btn { padding: 13px 16px; border: 1.5px solid #E6DFD2; border-radius: 11px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .16s; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; color: #1C1510; }
        .action-btn:hover { border-color: #5C1018; background: #F6EAEB; color: #5C1018; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(92,16,24,.08); }
        .action-btn.primary { background: #5C1018; border-color: #5C1018; color: #fff; }
        .action-btn.primary:hover { background: #6f1420; border-color: #6f1420; color: #fff; box-shadow: 0 4px 14px rgba(92,16,24,.28); }
        .action-icon { font-size: 20px; flex-shrink: 0; }
        .action-text { flex: 1; }
        .action-label { font-size: 11px; color: inherit; opacity: .7; display: block; margin-top: 2px; font-weight: 400; }

        /* Actividad reciente */
        .activity-title { font-size: 14px; font-weight: 700; color: #1C1510; margin: 20px 0 10px; padding-top: 18px; border-top: 1px solid #EFEAE0; }
        .activity-item { padding: 9px 0; border-bottom: 1px solid #F8F6F1; font-size: 13px; line-height: 1.5; }
        .activity-item:last-child { border-bottom: none; }
        .activity-item strong { color: #5C1018; }
        .activity-time { color: #6B6254; font-size: 11px; margin-top: 2px; }

        .empty-state { text-align: center; padding: 32px 18px; color: #6B6254; border: 1.5px dashed #E6DFD2; border-radius: 12px; background: #F8F6F1; font-size: 13px; }
        .loading-block { text-align: center; padding: 28px 16px; color: #6B6254; font-size: 13px; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,15,30,.45); backdrop-filter: blur(2px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #fff; border-radius: 18px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 24px 64px rgba(10,15,30,.16); max-height: 92vh; overflow-y: auto; border: 1px solid #EFEAE0; }
        .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
        .modal-top h2 { font-family: 'Crimson Pro',Georgia,serif; font-size: 22px; font-weight: 700; color: #5C1018; }
        .modal-top button { background: none; border: none; font-size: 22px; cursor: pointer; color: #6B6254; line-height: 1; transition: color .12s; }
        .modal-top button:hover { color: #5C1018; }
        .modal-desc { font-size: 13px; color: #6B6254; margin-bottom: 18px; line-height: 1.55; }
        .field { margin-bottom: 15px; }
        .field label { font-size: 11.5px; font-weight: 700; color: #594F42; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 6px; }
        .field input, .field textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #E6DFD2; border-radius: 9px; font-size: 14px; font-family: inherit; color: #1C1510; transition: border-color .14s, box-shadow .14s; }
        .field input:focus, .field textarea:focus { outline: none; border-color: #5C1018; box-shadow: 0 0 0 3px rgba(92,16,24,.08); }
        .field textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
        .drop-zone { border: 1.5px dashed #CDBFA6; border-radius: 11px; padding: 20px; text-align: center; cursor: pointer; background: #F8F6F1; transition: .18s; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #5C1018; background: #F6EAEB; }
        .file-preview { display: none; margin-top: 8px; background: #d1fae5; border: 1px solid #6ee7b7; border-radius: 9px; padding: 10px 14px; align-items: center; gap: 10px; }
        .file-preview.open { display: flex; }
        .file-preview button { background: none; border: none; cursor: pointer; color: #6B6254; font-size: 18px; }
        .excel-structure { margin-top: 10px; background: #F8F6F1; border-radius: 9px; padding: 12px 14px; font-size: 12px; color: #594F42; line-height: 1.8; }
        .excel-chip { display: inline-block; background: #fff; border: 1px solid #E6DFD2; border-radius: 4px; padding: 2px 8px; margin: 2px; }
        .alert-box { display: none; border-radius: 9px; padding: 11px 14px; font-size: 13px; margin-bottom: 14px; line-height: 1.45; }
        .alert-box.error { background: #fff1f1; border: 1px solid #fecaca; color: #991b1b; border-left: 4px solid var(--clr-danger); }
        .alert-box.success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; font-weight: 600; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }
        .btn-modal { padding: 10px 22px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; border: none; transition: .15s; }
        .btn-cancel { border: 1.5px solid #E6DFD2; background: #fff; color: #594F42; }
        .btn-cancel:hover { border-color: #CDBFA6; background: #F8F6F1; }
        .btn-send { background: #5C1018; color: #fff; }
        .btn-send:hover { background: #6f1420; box-shadow: 0 4px 14px rgba(92,16,24,.28); }

        @media (max-width: 1100px) { .content-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .header-main, .container, .hstats-bar { padding-left: 16px; padding-right: 16px; } }
        @media (max-width: 480px) { .header-left h1 { font-size: 20px; } .card { padding: 18px; } }
    </style>

    <link rel="stylesheet" href="sigpo-compact.css?v=20250529">
    <style>
        .container { max-width: 100% !important; width: 100% !important; margin: 0 !important; }
        .header-main { max-width: 100% !important; }
        .hstats-bar { max-width: 100% !important; }
        body > .header { background: #5C1018 !important; }
        body > .header .hstats-bar { background: transparent !important; border-top: 1px solid rgba(255,255,255,0.2) !important; }
        body { zoom: 1.0 !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-main">
            <div class="header-left">
                <h1 id="headerTitle">Coordinador/a</h1>
                <p id="headerSub">Cargando programas…</p>
            </div>
            <div class="header-actions">
                <div style="position:relative;display:inline-block;" id="notifWrapper" class="notif-wrapper">
                    <button class="icon-btn" type="button" onclick="toggleNotif()" title="Notificaciones">
                        🔔<span id="notif-badge" class="notif-badge" style="display:none;">0</span>
                    </button>
                    <div id="notif-dropdown" class="notif-panel" style="display:none;">
                        <div class="notif-head">
                            <span>Notificaciones</span>
                            <button type="button" onclick="marcarTodasLeidas()">Marcar todas como leídas</button>
                        </div>
                        <div id="notif-list"><div class="loading-block">Cargando…</div></div>
                    </div>
                </div>
                <button class="logout-btn" type="button" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
        <div class="hstats-bar">
            <div class="hstat"><div class="hstat-lbl">Estudiantes</div><div class="hstat-val" id="statEstudiantes">—</div></div>
            <div class="hstat"><div class="hstat-lbl">Activos</div><div class="hstat-val" id="statActivos">—</div></div>
            <div class="hstat"><div class="hstat-lbl">Bajas</div><div class="hstat-val" style="color:#9ca3af" id="statBajas">—</div></div>
            <div class="hstat"><div class="hstat-lbl">Al día</div><div class="hstat-val" style="color:#86efac" id="statAlDia">—</div></div>
            <div class="hstat"><div class="hstat-lbl">En mora</div><div class="hstat-val" style="color:#fca5a5" id="statMora">—</div></div>
            <div class="hstat hstat-sep"><div class="hstat-lbl">Recaudado</div><div class="hstat-val" id="statRecaudado">—</div></div>
        </div>
    </div>

    <div class="container">
        <div class="content-grid">
            <!-- Columna principal -->
            <div class="card">
                <div class="tabs-bar">
                    <button id="tab-programas" class="tab-btn" type="button" onclick="mostrarTab('programas')">🎓 Mis Programas/Cursos</button>
                    <button id="tab-cohortes" class="tab-btn active" type="button" onclick="mostrarTab('cohortes')">📋 Mis Cohortes</button>
                    <button class="tab-btn accent" type="button" onclick="irAGastos()">💸 Cargar Gastos</button>
                </div>
                <div id="panel-programas" style="display:none;">
                    <div class="items-list" id="programasList"></div>
                </div>
                <div id="panel-cohortes">
                    <div class="items-list" id="cohortesList"></div>
                </div>
            </div>

            <!-- Columna lateral -->
            <div class="card">
                <h2 class="card-title">Acciones rápidas</h2>
                <div class="quick-actions">
                    <button class="action-btn primary" type="button" onclick="descargarPlantilla()">
                        <span class="action-icon">📥</span>
                        <span class="action-text">Descargar plantilla Excel
                            <span class="action-label">Datos para crear un programa o edición</span>
                        </span>
                    </button>
                    <button class="action-btn secondary" type="button" onclick="irAGastos()">
                        <span class="action-icon">💸</span>
                        <span class="action-text">Cargar Gastos
                            <span class="action-label">Registrar egresos del programa</span>
                        </span>
                    </button>
                    <button class="action-btn secondary" type="button" onclick="irAReportes()">
                        <span class="action-icon">📊</span>
                        <span class="action-text">Ver Reportes
                            <span class="action-label">Cashflow y estadísticas</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js?v=20250529"></script>
    <script src="cohorte_tabla.js?v=20250603"></script>
    <script>
    var dashboardData = null;
    var notificaciones = [];

    document.addEventListener('DOMContentLoaded', async function() {
        var sesion = await requireAuth();
        if (!sesion || sesion.rol !== 'COORDINADOR') { window.location.href = 'portal_login.html'; return; }
        cargarVista();
        cargarNotificaciones();
    });

    async function cargarVista() {
        try {
            var sesion = getSesion();
            var sb = await getSupabase();
            // Asignaciones del coordinador:
            //  - progIds: programas asignados SIN cohorte específica → ve TODAS sus cohortes
            //  - cohIdsAsignadas: cohortes específicas asignadas → ve SOLO esas
            var asig = sesion ? await obtenerAsignacionesCoordinador(sesion.dni) : { progIds: [], cohIds: [] };
            var progIds = asig.progIds;
            var cohIdsAsignadas = asig.cohIds;

            document.getElementById('headerTitle').textContent = sesion.nombre || 'Coordinador/a';

            if (!progIds.length && !cohIdsAsignadas.length) {
                document.getElementById('headerSub').textContent = 'Sin programas asignados';
                document.getElementById('statEstudiantes').textContent = '0';
                document.getElementById('statActivos').textContent = '0';
                document.getElementById('statBajas').textContent = '0';
                document.getElementById('statAlDia').textContent = '0';
                document.getElementById('statMora').textContent = '0';
                document.getElementById('statRecaudado').textContent = '$0';
                dashboardData = { programas:[], cohortes:[], actividadReciente:[] };
                renderDashboard(); return;
            }

            // Round 1: cohortes asignadas (por programa completo Y/O por cohorte específica)
            var cohQueries = [];
            if (progIds.length)         cohQueries.push(sb.from('cohortes').select('*').in('programa_id', progIds));
            if (cohIdsAsignadas.length) cohQueries.push(sb.from('cohortes').select('*').in('cohorte_id', cohIdsAsignadas));
            var cohResults = await Promise.all(cohQueries);
            var cohMap = {};
            cohResults.forEach(function(r){ (r.data||[]).forEach(function(c){ cohMap[c.cohorte_id] = c; }); });
            var cohortes = Object.keys(cohMap).map(function(k){ return cohMap[k]; });

            // Programas referenciados por las cohortes visibles (cubre programas completos y cohortes específicas)
            var allProgIds = [...new Set(cohortes.map(function(c){ return c.programa_id; }).concat(progIds))];
            var cohIds = cohortes.map(function(c){ return c.cohorte_id; });

            // Round 2: programas y cobros filtrados por las cohortes del coordinador
            var [rP, rCob] = await Promise.all([
                allProgIds.length ? sb.from('programas').select('*').in('programa_id', allProgIds) : Promise.resolve({data:[]}),
                cohIds.length ? sb.from('cobros').select('dni,programa_id,cohorte_id,estado,monto_abonado,monto_final,saldo_pendiente,moneda,no_aplica,fecha_vencimiento,recibo_url,comprobante_url').in('cohorte_id', cohIds) : Promise.resolve({data:[]})
            ]);
            var programas = rP.data || [];
            var cobros = rCob.data || [];
            cobros.forEach(function(c){ c._re = resolverEstadoCobro(c); });

            // Inscripciones (con estado_academico) para separar activos de bajas.
            var rInsc = cohIds.length
                ? await sb.from('inscripciones').select('cohorte_id, estado_academico, estudiante_id').in('cohorte_id', cohIds)
                : { data: [] };
            var inscripciones = rInsc.data || [];
            var _estIds = [...new Set(inscripciones.map(function(i){ return i.estudiante_id; }).filter(Boolean))];
            var rEstDni = _estIds.length ? await sb.from('estudiantes').select('id, dni').in('id', _estIds) : { data: [] };
            var dniById = {};
            (rEstDni.data || []).forEach(function(e){ dniById[e.id] = String(e.dni); });
            function _activeDnisDe(inscList) {
                return new Set(inscList.filter(function(i){ return (i.estado_academico || 'ACTIVO') === 'ACTIVO'; })
                                       .map(function(i){ return dniById[i.estudiante_id]; }).filter(Boolean));
            }
            function _totalDnisDe(inscList) {
                return new Set(inscList.map(function(i){ return dniById[i.estudiante_id]; }).filter(Boolean));
            }

            var cohProgMap = {};
            cohortes.forEach(function(c) { cohProgMap[c.cohorte_id] = c.programa_id; });
            var progNomMap = {};
            programas.forEach(function(p) { progNomMap[p.programa_id] = p.nombre; });

            // Total = inscriptos; Activos = sin baja; Bajas excluidas de al día / mora.
            var dnisActivos = _activeDnisDe(inscripciones);
            var dnisTotal   = _totalDnisDe(inscripciones);
            var totalEst    = dnisTotal.size;
            var activosEst  = dnisActivos.size;
            var bajasEst    = totalEst - activosEst;
            // "En mora" = activo con al menos una cuota EN_MORA (en vivo). "Al día" = activo sin EN_MORA.
            var dnisEnMora = new Set(cobros.filter(function(c) { return dnisActivos.has(String(c.dni)) && c._re === 'EN_MORA'; }).map(function(c) { return String(c.dni); }));
            var dnisAlDia  = new Set([...dnisActivos].filter(function(dni) { return !dnisEnMora.has(dni); }));
            var recaudadoARS = cobros.filter(function(c) { return (c.moneda||'ARS') === 'ARS'; })
                                     .reduce(function(s,c) { return s + calcMontoAbonado(c); }, 0);
            var recaudadoUSD = cobros.filter(function(c) { return c.moneda === 'USD'; })
                                     .reduce(function(s,c) { return s + calcMontoAbonado(c); }, 0);
            var recaudado = recaudadoARS;

            document.getElementById('headerSub').textContent = programas.map(function(p) { return p.nombre; }).join(' · ');
            document.getElementById('statEstudiantes').textContent = totalEst;
            document.getElementById('statActivos').textContent = activosEst;
            document.getElementById('statBajas').textContent = bajasEst;
            document.getElementById('statAlDia').textContent = dnisAlDia.size;
            document.getElementById('statMora').textContent = dnisEnMora.size;
            document.getElementById('statRecaudado').textContent = fMontoDual(recaudadoARS, recaudadoUSD);

            var programasStats = programas.map(function(p) {
                var cohsProg = cohortes.filter(function(c) { return c.programa_id === p.programa_id; });
                var inscProg = inscripciones.filter(function(i) { return cohProgMap[i.cohorte_id] === p.programa_id; });
                return {
                    programaId: p.programa_id, nombre: p.nombre, tipo: p.tipo || 'Programa',
                    estudiantes: _totalDnisDe(inscProg).size,
                    cohortes: cohsProg.length, estado: p.estado === 'ACTIVO' ? 'Activo' : 'Cerrado',
                    destino: 'Coordinador_3_Programas_de_posgrado.html?programa=' + p.programa_id
                };
            });

            var cohortesStats = cohortes.map(function(c) {
                var cobs = cobros.filter(function(x) { return x.cohorte_id === c.cohorte_id; });
                var inscCoh = inscripciones.filter(function(i) { return i.cohorte_id === c.cohorte_id; });
                var activeDnisCoh = _activeDnisDe(inscCoh);
                var totalCoh = _totalDnisDe(inscCoh).size;
                var activosCoh = activeDnisCoh.size;
                // En mora = activo con EN_MORA; al día = activo sin EN_MORA. Bajas excluidas.
                var morSet = new Set(cobs.filter(function(x) { return activeDnisCoh.has(String(x.dni)) && x._re === 'EN_MORA'; }).map(function(x) { return String(x.dni); }));
                var mor = morSet.size;
                var alD = activosCoh - mor;
                var recARS = cobs.filter(function(x) { return (x.moneda||'ARS') === 'ARS'; })
                                 .reduce(function(s,x) { return s + calcMontoAbonado(x); }, 0);
                var recUSD = cobs.filter(function(x) { return x.moneda === 'USD'; })
                                 .reduce(function(s,x) { return s + calcMontoAbonado(x); }, 0);
                return {
                    cohorteId: c.cohorte_id, nombre: c.nombre || 'Cohorte',
                    programa: progNomMap[c.programa_id] || '',
                    estado: c.estado === 'ACTIVO' ? 'Activa' : 'Cerrada',
                    estudiantes: totalCoh, activos: activosCoh, bajas: totalCoh - activosCoh, alDia: alD, mora: mor,
                    recaudado: fMontoDual(recARS, recUSD),
                    fechaInicio: c.fecha_inicio || '', fechaFin: c.fecha_fin || '',
                    destino: 'coordinador_3_cohorte.html?cohorte_id=' + c.cohorte_id
                };
            });

            dashboardData = { programas: programasStats, cohortes: cohortesStats, actividadReciente: [] };
            renderDashboard();
        } catch(e) { console.error('Error cargando dashboard:', e); }
    }

    function renderDashboard() { renderProgramas(); renderCohortes(); renderActividad(); mostrarTab('cohortes'); }

    function renderProgramas() {
        var cont = document.getElementById('programasList');
        if (!dashboardData.programas.length) { cont.innerHTML = '<div class="empty-state">No hay programas o cursos asignados.</div>'; return; }
        cont.innerHTML = dashboardData.programas.map(function(p) {
            return '<div class="cohorte-item" onclick="irADestino(\'' + escapeJs(p.destino) + '\')">' +
                '<div class="ci-top"><div><div class="ci-name">' + escapeHtml(p.nombre) + '</div>' +
                '<div class="ci-program">' + escapeHtml(p.tipo) + '</div></div>' +
                '<span class="ci-badge ' + (p.estado === 'Activo' ? 'activa' : 'cerrada') + '">' + escapeHtml(p.estado) + '</span></div>' +
                '<div class="ci-stats"><span>👥 ' + p.estudiantes + ' estudiantes</span><span>📅 ' + p.cohortes + ' cohortes</span></div>' +
                '</div>';
        }).join('');
    }

    function renderCohortes() {
        var cont = document.getElementById('cohortesList');
        if (!dashboardData.cohortes.length) { cont.innerHTML = '<div class="empty-state">No hay cohortes para mostrar.</div>'; return; }
        cont.innerHTML = dashboardData.cohortes.map(function(c) {
            var fechas = c.fechaInicio ? (c.fechaInicio + (c.fechaFin ? ' — ' + c.fechaFin : '')) : '';
            return '<div class="cohorte-item" onclick="irADestino(\'' + escapeJs(c.destino) + '\')">' +
                '<div class="ci-top"><div><div class="ci-name">' + escapeHtml(c.nombre) + '</div>' +
                (c.programa ? '<div class="ci-program">' + escapeHtml(c.programa) + '</div>' : '') + '</div>' +
                '<span class="ci-badge ' + (c.estado === 'Activa' ? 'activa' : 'cerrada') + '">' + escapeHtml(c.estado) + '</span></div>' +
                '<div class="ci-stats"><span>👥 ' + c.estudiantes + ' estudiantes</span>' +
                '<span>🟢 ' + (c.activos != null ? c.activos : c.estudiantes) + ' activos</span>' +
                '<span>⚪ ' + (c.bajas || 0) + ' bajas</span>' +
                '<span>✓ ' + c.alDia + ' al día</span><span>⚠ ' + c.mora + ' en mora</span>' +
                '<span>💰 ' + escapeHtml(c.recaudado) + '</span></div>' +
                (fechas ? '<div class="ci-dates">' + escapeHtml(fechas) + '</div>' : '') +
                '</div>';
        }).join('');
    }

    function renderActividad() {
        var cont = document.getElementById('activityList');
        if (!cont) return;
        if (!dashboardData.actividadReciente.length) { cont.innerHTML = '<div class="empty-state">No hay actividad reciente.</div>'; return; }
        cont.innerHTML = dashboardData.actividadReciente.map(function(a) {
            return '<div class="activity-item"><strong>' + escapeHtml(a.titulo) + '</strong>' +
                (a.descripcion ? ' — ' + escapeHtml(a.descripcion) : '') +
                '<div class="activity-time">' + escapeHtml(a.tiempo) + '</div></div>';
        }).join('');
    }

    function mostrarTab(tab) {
        var panelP = document.getElementById('panel-programas');
        var panelC = document.getElementById('panel-cohortes');
        var tabP = document.getElementById('tab-programas');
        var tabC = document.getElementById('tab-cohortes');
        if (tab === 'programas') {
            panelP.style.display = 'block'; panelC.style.display = 'none';
            tabP.classList.add('active'); tabC.classList.remove('active');
        } else {
            panelP.style.display = 'none'; panelC.style.display = 'block';
            tabP.classList.remove('active'); tabC.classList.add('active');
        }
    }

    function irAGastos()   { navegar('coordinador_5_Gestion_gasto.html'); }
    function irAReportes() { navegar('coordinador_4_reportes.html'); }
    function irADestino(destino) { if (destino) navegar(destino); }

    // Descarga una plantilla Excel (3 hojas) con los datos necesarios para crear
    // un programa/curso, su cohorte/edición, las cuotas y el listado de estudiantes.
    function descargarPlantilla() {
        if (typeof XLSX === 'undefined') { alert('No se pudo cargar el generador de Excel. Recargá la página e intentá de nuevo.'); return; }
        var wb = XLSX.utils.book_new();

        // Hoja 1 — Programa / Cohorte
        var programa = [
            ['Campo', 'Valor', 'Ayuda / Ejemplo'],
            ['Tipo', '', 'Maestría / Especialización / Doctorado / Diplomatura / Micro-maestría / Curso / Diplomado'],
            ['Programa o Curso (nombre)', '', 'Ej: Especialización en Costos y Gestión Empresarial'],
            ['¿Cohorte o Edición?', '', 'Escribir "Cohorte" o "Edición"'],
            ['Nombre de la cohorte/edición', '', 'Ej: Cohorte 2026-2027  /  8ª Edición 2026'],
            ['Moneda', '', 'ARS o USD'],
            ['Fecha de inicio', '', 'DD/MM/AAAA'],
            ['Fecha de fin', '', 'DD/MM/AAAA'],
            ['Cantidad de cuotas', '', 'Ej: 12'],
            ['Mes/Año de la cuota 1', '', 'Ej: Marzo 2026  (el vencimiento es el día 15)'],
            ['¿Tiene inscripción? (Sí/No)', '', 'Sí o No'],
            ['Monto de la inscripción', '', 'Solo si tiene inscripción. Ej: 50000'],
            ['Vencimiento de la inscripción', '', 'Solo si tiene inscripción. DD/MM/AAAA'],
            ['Valor de cuota (si son todas iguales)', '', 'Si TODAS las cuotas valen lo mismo, poné el monto acá. Si varían, dejá esto vacío y completá la hoja "Cuotas".']
        ];
        var wsP = XLSX.utils.aoa_to_sheet(programa);
        wsP['!cols'] = [{ wch: 36 }, { wch: 26 }, { wch: 62 }];
        XLSX.utils.book_append_sheet(wb, wsP, 'Programa');

        // Hoja 2 — Cuotas (completar SOLO si los montos varían de una cuota a otra)
        var cuotas = [
            ['Nº de cuota', 'Período (Mes/Año)', 'Monto'],
            [1, 'Marzo 2026', ''],
            [2, 'Abril 2026', ''],
            [3, 'Mayo 2026', '']
        ];
        var wsC = XLSX.utils.aoa_to_sheet(cuotas);
        wsC['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 16 }];
        XLSX.utils.book_append_sheet(wb, wsC, 'Cuotas');

        // Hoja 3 — Estudiantes
        var estudiantes = [
            ['Apellido', 'Nombre', 'DNI', 'Email', 'Descuento (%)'],
            ['Pérez', 'Juan', '30111222', 'juan.perez@example.com', 0],
            ['', '', '', '', '']
        ];
        var wsE = XLSX.utils.aoa_to_sheet(estudiantes);
        wsE['!cols'] = [{ wch: 22 }, { wch: 22 }, { wch: 14 }, { wch: 32 }, { wch: 14 }];
        XLSX.utils.book_append_sheet(wb, wsE, 'Estudiantes');

        XLSX.writeFile(wb, 'plantilla_programa_cohorte.xlsx');
    }

    function cargarNotificaciones() {
        var sesion = getSesion();
        obtenerNotificaciones(sesion ? (sesion.rol || 'COORDINADOR') : 'COORDINADOR')
            .then(renderNotificaciones).catch(function() { renderNotificaciones([]); });
    }
    function renderNotificaciones(datos) {
        notificaciones = Array.isArray(datos) ? datos : [];
        var badge = document.getElementById('notif-badge');
        var sinLeer = notificaciones.filter(function(n) { return !n.leida; }).length;
        badge.textContent = sinLeer; badge.style.display = sinLeer > 0 ? 'flex' : 'none';
        var lista = document.getElementById('notif-list');
        if (!notificaciones.length) { lista.innerHTML = '<div class="loading-block">No hay notificaciones.</div>'; return; }
        lista.innerHTML = notificaciones.map(function(n, i) {
            return '<div class="notif-item ' + (n.leida ? '' : 'unread') + '" onclick="leerNotif(' + i + ')">' +
                '<strong>' + escapeHtml(n.tipo || 'Notificación') + '</strong>' +
                '<div>' + escapeHtml(n.mensaje || '') + '</div>' +
                '<small>' + escapeHtml(n.tiempo || '') + '</small></div>';
        }).join('');
    }
    // toggleNotif y cierre-al-click-afuera: ahora en supabase.js (usa #notif-dropdown / .notif-wrapper)
    function leerNotif(index) { if (!notificaciones[index]) return; notificaciones[index].leida = true; renderNotificaciones(notificaciones); }
    function marcarTodasLeidas() { notificaciones = notificaciones.map(function(n) { n.leida=true; return n; }); renderNotificaciones(notificaciones); marcarTodasNotificacionesLeidas(); }

    async function leerArchivoBase64(archivo) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(e) { var raw = String(e.target.result||''); resolve({ name:archivo.name, mimeType:archivo.type||'application/vnd.ms-excel', size:archivo.size, base64:raw.includes(',')?raw.split(',')[1]:raw }); };
            reader.onerror = reject; reader.readAsDataURL(archivo);
        });
    }
    </script>
