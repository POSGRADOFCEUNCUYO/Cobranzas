<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Docente</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:#2c2c2c; font-size: 14px; }
        .header { background:linear-gradient(135deg,#5C1018 0%,#8C1A28 100%); color:white; padding:20px 40px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .header-content { display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .header-left h1 { font-family:'Crimson Pro',serif; font-size:24px; margin-bottom:3px; }
        .header-left p { opacity:.85; font-size:13px; }
        .logout-btn { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:white; padding:9px 18px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .2s; }
        .logout-btn:hover { background:rgba(192,57,43,0.55); }
        .btn-back { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:white; padding:9px 18px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .2s; }
        .btn-back:hover { background:rgba(255,255,255,0.28); }
        .notif-wrapper { position:relative; display:inline-block; }
        .notif-btn { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:white; padding:9px 13px; border-radius:8px; font-size:18px; cursor:pointer; position:relative; transition:background .2s; }
        .notif-btn:hover { background:rgba(255,255,255,0.28); }
        #notif-badge { position:absolute; top:-4px; right:-4px; background:var(--clr-danger); color:white; border-radius:50%; min-width:18px; height:18px; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 3px; }
        #notif-dropdown { display:none; position:absolute; right:0; top:48px; width:320px; background:white; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:500; overflow:hidden; color:#2c2c2c; border:1px solid #e5e7eb; }
        .notif-head { padding:14px 16px; border-bottom:1px solid #f0f0f0; font-weight:700; color:#5C1018; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .notif-head button { background:none; border:none; color:#8C1A28; font-size:12px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
        .container { width:100%; padding: 28px 32px; box-sizing:border-box; }
        .stats-grid { display:grid; grid-template-columns:repeat(8,1fr); gap: 10px; margin-bottom:28px; }
        @media(max-width:1100px){ .stats-grid{ grid-template-columns:repeat(4,1fr); } }
        @media(max-width:640px){ .stats-grid{ grid-template-columns:repeat(2,1fr); } }
        .stat-card { background:#F8F6F1; padding:14px 12px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.06); border-left:3px solid var(--accent); overflow:visible; }
        .stat-card.success { border-left-color:var(--success); }
        .stat-card.danger  { border-left-color:var(--danger); }
        .stat-card.info    { border-left-color:var(--info); }
        .stat-card.warning { border-left-color:var(--warning); }
        .stat-label { font-size:10px; color:#6B6254; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; line-height:1.3; font-weight:700; }
        .stat-value { font-family:'Crimson Pro',Georgia,serif; font-size:22px; font-weight:700; color:var(--primary); line-height:1; letter-spacing:-.02em; }
        .stat-value.success{ color:var(--success); } .stat-value.danger{ color:var(--danger); } .stat-value.info{ color:var(--info); } .stat-value.warning{ color:var(--warning); }
        .section-title { font-family:'Crimson Pro',serif; font-size:22px; color:var(--primary); margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid var(--line); display:flex; align-items:center; gap:10px; }
        .tabs-bar { display:flex; gap:8px; margin-bottom:20px; }
        .tab-btn { padding:8px 18px; border:2px solid var(--line); border-radius:8px; background:white; font-size:14px; font-weight:600; color:#666; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .2s; }
        .tab-btn.active { border-color:var(--primary); background:var(--primary); color:white; }
        .card { background:white; border-radius:12px; padding:28px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
        .grid-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
        .item-card { background:#f8f6f1; border-radius:10px; padding:18px; border:2px solid transparent; cursor:pointer; transition:all .2s; }
        .item-card:hover { border-color:var(--accent); background:#fffbf0; transform:translateY(-2px); }
        .item-name { font-weight:700; color:var(--primary); font-size:15px; margin-bottom:10px; line-height:1.3; }
        .item-stats { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:#555; }
        .item-stats span { display:flex; align-items:center; gap:4px; }
        .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; }
        .badge-success { background:#d1fae5; color:#065f46; }
        .badge-warning { background:#fef3c7; color:#92400e; }
        .badge-danger  { background:#fee2e2; color:#991b1b; }
        .empty { text-align:center; padding:40px; color:var(--muted); border:2px dashed var(--line); border-radius:10px; }
        .loading { text-align:center; padding:36px; color:var(--muted); font-size:15px; }
        .error-banner { background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; padding:14px 18px; border-radius:8px; margin-bottom:20px; font-size:14px; display:none; }
        .readonly-notice { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; padding:10px 16px; border-radius:8px; margin-bottom:24px; font-size:13px; }
    </style>
    <link rel="stylesheet" href="sigpo-theme.css?v=20250529">
    <link rel="stylesheet" href="sigpo-compact.css?v=20250529">
    <style>
        .stat-card { overflow: visible !important; }
        .container { max-width: 100% !important; }
        .header-content { max-width: 100% !important; }
        body { zoom: 1.0 !important; }
        .stat-value { font-size: 22px !important; font-family: 'Crimson Pro',Georgia,serif !important; font-weight: 700 !important; letter-spacing: -.02em !important; line-height: 1 !important; white-space: nowrap !important; }
        .stat-label { font-size: 10px !important; font-weight: 700 !important; color: #6B6254 !important; text-transform: uppercase !important; letter-spacing: .06em !important; margin-bottom: 6px !important; line-height: 1.3 !important; font-family: 'DM Sans',sans-serif !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="header-left">
            <h1>Dashboard Docente</h1>
            <p id="headerSub">Cargando…</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="notif-wrapper">
                <button class="notif-btn" onclick="toggleNotif()" title="Notificaciones"><svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#C49A2A"/></svg><span id="notif-badge"></span></button>
                <div id="notif-dropdown">
                    <div class="notif-head"><span>🔔 Notificaciones</span><button onclick="marcarTodasNotificacionesLeidas()">Marcar leídas</button></div>
                    <div id="notif-list" style="max-height:340px;overflow-y:auto;"><div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">Cargando…</div></div>
                </div>
            </div>
            <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="error-banner" id="errorBanner"></div>
    

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-label">Programas/Cursos</div><div class="stat-value" id="s-programas">—</div></div>
        <div class="stat-card"><div class="stat-label">Cohortes/Ediciones</div><div class="stat-value" id="s-cohortes">—</div></div>
        <div class="stat-card"><div class="stat-label">Estudiantes</div><div class="stat-value" id="s-estudiantes">—</div></div>
        <div class="stat-card"><div class="stat-label">Activos</div><div class="stat-value" id="s-activos">—</div></div>
        <div class="stat-card"><div class="stat-label">Bajas</div><div class="stat-value" id="s-bajas" style="color:#9ca3af;">—</div></div>
        <div class="stat-card success"><div class="stat-label">Al Día</div><div class="stat-value success" id="s-aldia">—</div></div>
        <div class="stat-card danger"><div class="stat-label">En Mora</div><div class="stat-value danger" id="s-mora">—</div></div>
        <div class="stat-card info"><div class="stat-label">Recaudado</div><div class="stat-value info" id="s-recaudado">—</div></div>
        <div class="stat-card warning"><div class="stat-label">Egresos</div><div class="stat-value warning" id="s-egresos">—</div></div>
        <div class="stat-card"><div class="stat-label">Saldo</div><div class="stat-value" id="s-saldo">—</div></div>
    </div>

    <div class="card">
        <div class="tabs-bar">
            <div style="display:flex;gap:8px;">
                <button class="tab-btn active" id="tab-cohortes" onclick="mostrarTab('cohortes')">📚 Cohortes / Ediciones</button>
                <button class="tab-btn" id="tab-programas" onclick="mostrarTab('programas')">🎓 Programas / Cursos</button>
                <button class="tab-btn" style="background:#5C1018;color:white;border-color:#5C1018;" onclick="navegar('profesor_gastos.html')">💸 Gastos</button>
                <button class="tab-btn" style="background:#0891b2;color:white;border-color:#0891b2;" onclick="navegar('profesor_reportes.html')">📊 Ver Reportes</button>
            </div>
        </div>
        <div id="panel-cohortes"><div class="loading">Cargando…</div></div>
        <div id="panel-programas" style="display:none;"><div class="loading">Cargando…</div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js?v=20250529"></script>
<script src="cohorte_tabla.js?v=20250603"></script>
<script>
var _programas = [], _cohortes = [], _cohProgMap = {}, _dniById = {};

document.addEventListener('DOMContentLoaded', async function() {
    var _sb = await getSupabase();
    var { data: { session: _session } } = await _sb.auth.getSession();
    if (!_session) { window.location.href = 'portal_login.html'; return; }
    var sesion = getSesion();
    if (!sesion || sesion.rol !== 'PROFESOR') { window.location.href = 'portal_login.html'; return; }
    document.getElementById('headerSub').textContent = '👋 Hola, ' + (sesion.nombre || 'Docente/a');
    try { await cargar(sesion); }
    catch(e) { mostrarError('Error al cargar datos: ' + e.message); }
});

async function cargar(sesion) {
    var sb     = await getSupabase();
    // Asignaciones del profesor:
    //  - progIds: programas asignados SIN cohorte específica → ve TODAS sus cohortes
    //  - cohIdsAsignadas: cohortes específicas asignadas → ve SOLO esas
    var asig            = await obtenerAsignacionesCoordinador(sesion.dni);
    var progIds         = asig.progIds;
    var cohIdsAsignadas = asig.cohIds;

    if (!progIds.length && !cohIdsAsignadas.length) {
        // Sin asignaciones — mostrar estado vacío
        _programas = []; _cohortes = [];
        document.getElementById('s-programas').textContent   = 0;
        document.getElementById('s-cohortes').textContent    = 0;
        document.getElementById('s-estudiantes').textContent = 0;
        document.getElementById('s-aldia').textContent       = 0;
        document.getElementById('s-mora').textContent        = 0;
        document.getElementById('s-recaudado').textContent   = fM(0);
        document.getElementById('s-egresos').textContent     = fM(0);
        document.getElementById('s-saldo').textContent       = fM(0);
        renderCohortes([], [], []);
        renderProgramas([], [], []);
        return;
    }

    // Round 1: cohortes asignadas (por programa completo Y/O por cohorte específica)
    var COH_COLS = 'cohorte_id,nombre,programa_id,estado,fecha_inicio,fecha_fin';
    var cohQueries = [];
    if (progIds.length)         cohQueries.push(sb.from('cohortes').select(COH_COLS).in('programa_id', progIds));
    if (cohIdsAsignadas.length) cohQueries.push(sb.from('cohortes').select(COH_COLS).in('cohorte_id', cohIdsAsignadas));
    var cohResults = await Promise.all(cohQueries);
    // Unificar y deduplicar por cohorte_id
    var cohMap = {};
    cohResults.forEach(function(r){ (r.data||[]).forEach(function(c){ cohMap[c.cohorte_id] = c; }); });
    _cohortes = Object.keys(cohMap).map(function(k){ return cohMap[k]; });
    _cohortes.forEach(function(c){ _cohProgMap[c.cohorte_id] = c.programa_id; });

    // Programas referenciados por las cohortes visibles (cubre programas completos y los de cohortes específicas)
    var allProgIds = [...new Set(_cohortes.map(function(c){ return c.programa_id; }).concat(progIds))];
    var progRes  = allProgIds.length
        ? await sb.from('programas').select('programa_id,nombre,tipo,estado').in('programa_id', allProgIds)
        : { data: [] };
    _programas = progRes.data || [];

    var cohIds = _cohortes.map(function(c){ return c.cohorte_id; });

    // Round 2: cobros, egresos e inscripciones filtrados por las cohortes del profesor
    var [cobRes, egrRes, inscRes] = await Promise.all([
        cohIds.length
            ? sb.from('cobros').select('dni,cohorte_id,programa_id,estado,monto_abonado,monto_final,saldo_pendiente,moneda,no_aplica,fecha_vencimiento,recibo_url,comprobante_url').in('cohorte_id', cohIds)
            : Promise.resolve({data:[]}),
        cohIds.length
            ? sb.from('egresos').select('cohorte_id,programa_id,tipo,monto_pagado,monto_original,moneda').in('cohorte_id', cohIds)
            : Promise.resolve({data:[]}),
        cohIds.length
            ? sb.from('inscripciones').select('estudiante_id,cohorte_id,estado_academico').in('cohorte_id', cohIds)
            : Promise.resolve({data:[]})
    ]);

    var cobros  = cobRes.data  || [];
    cobros.forEach(function(c){ c._re = resolverEstadoCobro(c); });
    var egresos = egrRes.data  || [];
    var inscFilt = inscRes.data || [];

    // DNI por estudiante, para excluir bajas de al día / mora.
    var _estIds = [...new Set(inscFilt.map(function(i){ return i.estudiante_id; }).filter(Boolean))];
    var rEstDni = _estIds.length ? await sb.from('estudiantes').select('id, dni').in('id', _estIds) : { data: [] };
    var dniById = {};
    (rEstDni.data || []).forEach(function(e){ dniById[e.id] = String(e.dni); });
    _dniById = dniById;

    // Totales globales — enrollment-based counting (estudiante × programa):
    // un estudiante en 2 programas cuenta como 2 unidades. Las bajas no cuentan en activos/al día/mora.
    function _keyInsc(i){ return i.estudiante_id + '|' + _cohProgMap[i.cohorte_id]; }
    var inscActivas = inscFilt.filter(function(i){ return (i.estado_academico || 'ACTIVO') === 'ACTIVO'; });
    var totalEst   = new Set(inscFilt.map(_keyInsc)).size;
    var activosEst = new Set(inscActivas.map(_keyInsc)).size;
    var bajasEst   = totalEst - activosEst;
    // Claves dni|programa de estudiantes ACTIVOS (para restringir la mora a activos)
    var activeDniProg = new Set(inscActivas.map(function(i){ return dniById[i.estudiante_id] + '|' + _cohProgMap[i.cohorte_id]; }));
    var dnisConMora = new Set(
        cobros.filter(function(c){ return c._re === 'EN_MORA'; })
              .map(function(c){
                  var pid = c.programa_id != null ? c.programa_id : _cohProgMap[c.cohorte_id];
                  return c.dni + '|' + pid;
              })
              .filter(function(k){ return activeDniProg.has(k); })
    );
    var recaudadoArs = cobros.filter(function(c){ return (c.moneda||'ARS')==='ARS'; })
        .reduce(function(s,c){ return s + calcMontoAbonado(c); }, 0);
    var recaudadoUsd = cobros.filter(function(c){ return c.moneda==='USD'; })
        .reduce(function(s,c){ return s + calcMontoAbonado(c); }, 0);
    var recaudado  = recaudadoArs;
    var egrExec    = egresos
        .filter(function(e){ return e.tipo === 'EJECUTADO' && (e.moneda||'ARS')==='ARS'; })
        .reduce(function(s,e){ return s + Number(e.monto_pagado||e.monto_original||0); }, 0);
    var egrExecUsd = egresos
        .filter(function(e){ return e.tipo === 'EJECUTADO' && e.moneda==='USD'; })
        .reduce(function(s,e){ return s + Number(e.monto_pagado||e.monto_original||0); }, 0);
    var saldo = recaudado - egrExec;

    // Stats globales
    document.getElementById('s-programas').textContent   = _programas.length;
    document.getElementById('s-cohortes').textContent    = _cohortes.length;
    document.getElementById('s-estudiantes').textContent = totalEst;
    var _sAct = document.getElementById('s-activos'); if (_sAct) _sAct.textContent = activosEst;
    var _sBaj = document.getElementById('s-bajas');   if (_sBaj) _sBaj.textContent = bajasEst;
    document.getElementById('s-aldia').textContent       = activosEst - dnisConMora.size;
    document.getElementById('s-mora').textContent        = dnisConMora.size;
    document.getElementById('s-recaudado').textContent   = fMontoDual(recaudadoArs, recaudadoUsd);
    document.getElementById('s-egresos').textContent     = fMontoDual(egrExec, egrExecUsd);
    var sEl = document.getElementById('s-saldo');
    sEl.textContent   = fM(saldo);
    sEl.style.color   = saldo < 0 ? 'var(--danger)' : 'var(--success)';

    // Renderizar listas
    renderCohortes(cobros, egresos, inscFilt);
    renderProgramas(cobros, egresos, inscFilt);
}

function renderCohortes(cobros, egresos, insc) {
    var panel = document.getElementById('panel-cohortes');
    if (!_cohortes.length) { panel.innerHTML = '<div class="empty">No hay cohortes/ediciones asignadas.</div>'; return; }
    var progMap = {};
    _programas.forEach(function(p){ progMap[p.programa_id] = p.nombre; });

    var html = '<div class="grid-list">' + _cohortes.map(function(c) {
        var cobsCoh = cobros.filter(function(x){ return x.cohorte_id === c.cohorte_id; });
        var inscCoh = insc.filter(function(i){ return i.cohorte_id === c.cohorte_id; });
        var inscCohAct = inscCoh.filter(function(i){ return (i.estado_academico || 'ACTIVO') === 'ACTIVO'; });
        var est     = new Set(inscCohAct.map(function(i){ return i.estudiante_id; })).size;
        var _activDnisC = new Set(inscCohAct.map(function(i){ return _dniById[i.estudiante_id]; }).filter(Boolean));
        var mora    = new Set(cobsCoh.filter(function(x){ return x._re==='EN_MORA' && _activDnisC.has(String(x.dni)); }).map(function(x){ return String(x.dni); })).size;
        var recArs  = cobsCoh.filter(function(x){ return (x.moneda||'ARS')==='ARS'; })
                              .reduce(function(s,x){ return s+calcMontoAbonado(x); },0);
        var recUsd  = cobsCoh.filter(function(x){ return x.moneda==='USD'; })
                              .reduce(function(s,x){ return s+calcMontoAbonado(x); },0);
        var rec     = recArs;
        var egr     = egresos.filter(function(e){ return e.cohorte_id===c.cohorte_id&&e.tipo==='EJECUTADO'&&(e.moneda||'ARS')==='ARS'; })
                              .reduce(function(s,e){ return s+Number(e.monto_pagado||e.monto_original||0); },0);
        var egrUsd  = egresos.filter(function(e){ return e.cohorte_id===c.cohorte_id&&e.tipo==='EJECUTADO'&&e.moneda==='USD'; })
                              .reduce(function(s,e){ return s+Number(e.monto_pagado||e.monto_original||0); },0);
        var saldo   = rec - egr;
        var badge   = c.estado==='ACTIVO' ? '<span class="badge badge-success">Activa</span>' : '<span class="badge badge-warning">' + esc(c.estado||'—') + '</span>';
        var fechas  = [c.fecha_inicio, c.fecha_fin].filter(Boolean).join(' → ');
        return '<div class="item-card" onclick="irCohorte(' + c.cohorte_id + ')">' +
            '<div class="item-name">' + esc(c.nombre) + ' ' + badge + '</div>' +
            '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">' + esc(progMap[c.programa_id]||'') + (fechas?' · '+esc(fechas):'') + '</div>' +
            '<div class="item-stats">' +
            '<span>👥 ' + est + ' est.</span>' +
            '<span style="color:var(--danger)">⚠️ ' + mora + ' mora</span>' +
            '<span style="color:var(--success)">💰 ' + fMontoDual(recArs, recUsd) + '</span>' +
            '<span style="color:var(--warning)">📤 ' + fMontoDual(egr, egrUsd) + '</span>' +
            '<span style="color:' + (saldo<0?'var(--danger)':'var(--success)') + '">⚖️ ' + fM(saldo) + '</span>' +
            '</div></div>';
    }).join('') + '</div>';
    panel.innerHTML = html;
}

function renderProgramas(cobros, egresos, insc) {
    var panel = document.getElementById('panel-programas');
    if (!_programas.length) { panel.innerHTML = '<div class="empty">No hay programas/cursos asignados.</div>'; return; }
    var html = '<div class="grid-list">' + _programas.map(function(p) {
        var cohsProg = _cohortes.filter(function(c){ return String(c.programa_id)===String(p.programa_id); });
        var cohIdsProg = cohsProg.map(function(c){ return c.cohorte_id; });
        var inscProg = insc.filter(function(i){ return cohIdsProg.indexOf(i.cohorte_id)>=0 && (i.estado_academico || 'ACTIVO') === 'ACTIVO'; });
        var est   = new Set(inscProg.map(function(i){ return i.estudiante_id; })).size;
        var _activDnisP = new Set(inscProg.map(function(i){ return _dniById[i.estudiante_id]; }).filter(Boolean));
        var cobProg = cobros.filter(function(c){ return String(c.programa_id)===String(p.programa_id); });
        var mora  = new Set(cobProg.filter(function(c){ return c._re==='EN_MORA' && _activDnisP.has(String(c.dni)); }).map(function(c){ return String(c.dni); })).size;
        var recArs = cobProg.filter(function(c){ return (c.moneda||'ARS')==='ARS'; })
                           .reduce(function(s,c){ return s+calcMontoAbonado(c); },0);
        var recUsd = cobProg.filter(function(c){ return c.moneda==='USD'; })
                           .reduce(function(s,c){ return s+calcMontoAbonado(c); },0);
        var rec   = recArs;
        var egr   = egresos.filter(function(e){ return String(e.programa_id)===String(p.programa_id)&&e.tipo==='EJECUTADO'&&(e.moneda||'ARS')==='ARS'; })
                           .reduce(function(s,e){ return s+Number(e.monto_pagado||e.monto_original||0); },0);
        var egrUsd = egresos.filter(function(e){ return String(e.programa_id)===String(p.programa_id)&&e.tipo==='EJECUTADO'&&e.moneda==='USD'; })
                           .reduce(function(s,e){ return s+Number(e.monto_pagado||e.monto_original||0); },0);
        var saldo = rec - egr;
        var badge = p.estado==='ACTIVO' ? '<span class="badge badge-success">Activo</span>' : '<span class="badge badge-warning">' + esc(p.estado||'—') + '</span>';
        return '<div class="item-card" onclick="navegar(\'profesor_3_programa.html?programa_id=' + p.programa_id + '\')">' +
            '<div class="item-name">🎓 ' + esc(p.nombre) + ' ' + badge + '</div>' +
            '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">' + esc(p.tipo||'') + ' · ' + cohsProg.length + ' cohortes/ediciones</div>' +
            '<div class="item-stats">' +
            '<span>👥 ' + est + ' est.</span>' +
            '<span style="color:var(--danger)">⚠️ ' + mora + ' mora</span>' +
            '<span style="color:var(--success)">💰 ' + fMontoDual(recArs, recUsd) + '</span>' +
            '<span style="color:var(--warning)">📤 ' + fMontoDual(egr, egrUsd) + '</span>' +
            '<span style="color:' + (saldo<0?'var(--danger)':'var(--success)') + '">⚖️ ' + fM(saldo) + '</span>' +
            '</div></div>';
    }).join('') + '</div>';
    panel.innerHTML = html;
}

function mostrarTab(tab) {
    document.getElementById('panel-cohortes').style.display  = tab==='cohortes'  ? '' : 'none';
    document.getElementById('panel-programas').style.display = tab==='programas' ? '' : 'none';
    document.getElementById('tab-cohortes').classList.toggle('active',  tab==='cohortes');
    document.getElementById('tab-programas').classList.toggle('active', tab==='programas');
}

function irCohorte(id) { navegar('profesor_2_cohorte.html?cohorte_id=' + id); }

function mostrarError(msg) {
    var el = document.getElementById('errorBanner');
    el.textContent = '⚠️ ' + msg;
    el.style.display = 'block';
}
</script>
