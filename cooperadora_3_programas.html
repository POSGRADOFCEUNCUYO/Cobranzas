<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programas de Posgrado - Cooperadora</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'DM Sans', sans-serif; background: #f8f6f1; font-size: 14px; }
        
        .header { background: linear-gradient(135deg, #5C1018 0%, #8C1A28 100%); color: white; padding: 20px 40px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .breadcrumb { font-size: 14px; margin-bottom: 12px; }
        .breadcrumb a { color: white; text-decoration: none; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 6px 13px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; transition: background 0.2s; }
        .breadcrumb a:hover { background: rgba(255,255,255,0.25); }
        .header h1 { font-family: 'Crimson Pro', serif; font-size: 24px; }
        .btn-logout { padding: 8px 18px; background: transparent; color: white; border: 2px solid rgba(255,255,255,0.7); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s, border-color 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.15); border-color: white; }
        
        .container { max-width: 1400px; margin: 20px auto; padding: 0 24px; }
        
        .programs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        
        .program-card { 
            background: white; border-radius: 12px; padding: 14px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); 
            cursor: pointer; transition: all 0.3s;
            border: 2px solid transparent;
        }
        .program-card:hover { 
            border-color: var(--accent); 
            transform: translateY(-4px); 
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); 
        }
        
        .program-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .program-icon { 
            width: 60px; height: 60px; 
            background: linear-gradient(135deg, var(--primary) 0%, #8C1A28 100%); 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            font-size: 28px; 
        }
        
        .program-name { font-size: 14px; font-weight: 700; color: var(--primary); }
        .program-type { font-size: 13px; color: #666; margin-top: 4px; text-transform: uppercase; }
        
        .program-stats { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 12px; margin-top: 16px; 
            padding-top: 16px; border-top: 2px solid #f0f0f0; 
        }
        .stat { text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: #666; margin-top: 4px; }
        
        .filters { 
            background: white; padding: 20px 32px; border-radius: 12px; 
            margin-bottom: 24px; display: flex; gap: 16px; align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
        }
        .filter-btn { 
            padding: 8px 16px; border: 2px solid #e0e0e0; background: white; 
            border-radius: 6px; font-size: 14px; cursor: pointer; 
            transition: all 0.2s; font-family: 'DM Sans', sans-serif; font-weight: 600; 
        }
        .filter-btn:hover { border-color: var(--accent); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        @keyframes pulse { 0%,100%{opacity:inherit} 50%{opacity:0.6} }
    </style>
    <link rel="stylesheet" href="sigpo-theme.css?v=20250529">
    <link rel="stylesheet" href="sigpo-compact.css?v=20250529">
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div>
                <div class="breadcrumb"><a href="cooperadora_2_Dashboard.html">← Volver al Dashboard</a></div>
                <h1>📚 Programas de Posgrado</h1>
                <p>Cooperadora FCE-UNCUYO • Seleccionar programa para ver cohortes</p>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
                <div class="notif-wrapper" style="position:relative;">
                    <button onclick="toggleNotif()" title="Notificaciones" style="background:none;border:none;cursor:pointer;position:relative;padding:8px;border-radius:8px;">
                        <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#C49A2A"/></svg>
                        <span id="notif-badge" style="position:absolute;top:2px;right:2px;background:var(--clr-danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #5C1018;line-height:1;">0</span>
                    </button>
                    <div id="notif-dropdown" style="display:none;position:absolute;top:calc(100% + 10px);right:0;width:380px;max-height:460px;overflow-y:auto;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);z-index:999;border:1px solid #e5e7eb;">
                        <div style="padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
                            <h3 style="font-size:15px;font-weight:700;color:#5C1018;">🔔 Notificaciones</h3>
                            <button onclick="marcarTodasLeidas()" style="font-size:12px;color:#C49A2A;cursor:pointer;background:none;border:none;font-weight:600;font-family:'DM Sans',sans-serif;">Marcar todas como leídas</button>
                        </div>
                        <div id="notif-list"><div style="padding:32px 20px;text-align:center;color:#9ca3af;font-size:14px;">Cargando…</div></div>
                    </div>
                </div>
                <a href="portal_login.html" onclick="return cerrarSesion(event)" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.35);color:white;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="filters">
            <span style="font-weight: 600; color: #666;">Filtrar por tipo:</span>
            <button class="filter-btn active" onclick="filtrar('todos')">Todos (—)</button>
            <button class="filter-btn" onclick="filtrar('doctorado')">Doctorados (—)</button>
            <button class="filter-btn" onclick="filtrar('maestria')">Maestrías (—)</button>
            <button class="filter-btn" onclick="filtrar('especializacion')">Especializaciones (—)</button>
            <button class="filter-btn" onclick="filtrar('micro')">Micro Maestrías (—)</button>
            <button class="filter-btn" onclick="filtrar('diplomatura')">Diplomatura/Diplomado (—)</button>
        </div>

        <div class="programs-grid" id="programsGrid">
            <div class="program-card" style="pointer-events:none;opacity:0.5;animation:pulse 1.2s infinite;">
                <div class="program-header"><div class="program-icon">⏳</div><div><div class="program-name" style="background:#e0e0e0;height:18px;border-radius:4px;width:180px;"></div><div class="program-type" style="background:#f0f0f0;height:12px;border-radius:4px;width:100px;margin-top:6px;"></div></div></div>
                <div class="program-stats"><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div></div>
            </div>
            <div class="program-card" style="pointer-events:none;opacity:0.35;animation:pulse 1.2s infinite 0.2s;">
                <div class="program-header"><div class="program-icon">⏳</div><div><div class="program-name" style="background:#e0e0e0;height:18px;border-radius:4px;width:160px;"></div><div class="program-type" style="background:#f0f0f0;height:12px;border-radius:4px;width:90px;margin-top:6px;"></div></div></div>
                <div class="program-stats"><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div></div>
            </div>
            <div class="program-card" style="pointer-events:none;opacity:0.2;animation:pulse 1.2s infinite 0.4s;">
                <div class="program-header"><div class="program-icon">⏳</div><div><div class="program-name" style="background:#e0e0e0;height:18px;border-radius:4px;width:200px;"></div><div class="program-type" style="background:#f0f0f0;height:12px;border-radius:4px;width:80px;margin-top:6px;"></div></div></div>
                <div class="program-stats"><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div><div class="stat"><div class="stat-value" style="background:#e0e0e0;height:28px;border-radius:4px;"></div></div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js?v=20250529"></script>
<script>
    /* ══ HELPERS ══ */
    // fMillones: ahora en supabase.js (monto completo)

    /* ══ ESTADO GLOBAL ══ */
    var _programas = [];
    var _filtroActivo = 'todos';

    /* ══ ICONO POR TIPO ══ */
    function iconoTipo(tipo) {
        var t = (tipo || '').toUpperCase();
        var iconos = {
            'DOCTORADO':      '🎓',
            'MAESTRIA':       '📊',
            'ESPECIALIZACION':'💼',
            'DIPLOMADO':      '🏅',
            'DIPLOMATURA':    '📜',
            'CURSO':          '📖',
            'MICRO_MAESTRIA': '🔬'
        };
        return iconos[t] || '📚';
    }

    /* ══ LABEL TIPO ══ */
    function labelTipo(tipo) {
        var t = (tipo || '').toUpperCase();
        var labels = {
            'DOCTORADO':      'Doctorado',
            'MAESTRIA':       'Maestria',
            'ESPECIALIZACION':'Especializacion',
            'DIPLOMADO':      'Diplomado',
            'DIPLOMATURA':    'Diplomatura',
            'CURSO':          'Curso',
            'MICRO_MAESTRIA': 'Micro Maestria'
        };
        return labels[t] || tipo || '—';
    }

    /* ══ ETIQUETA COHORTES/EDICIONES ══ */
    function labelCohorte(tipo, cantidad) {
        var TIPOS_PROGRAMA = ['DOCTORADO', 'MAESTRIA', 'ESPECIALIZACION'];
        var t = (tipo || '').toUpperCase();
        var esPrograma = TIPOS_PROGRAMA.indexOf(t) >= 0;
        if (cantidad === 1) return esPrograma ? 'Cohorte' : 'Edicion';
        return esPrograma ? 'Cohortes' : 'Ediciones';
    }

    /* ══ FORMATO MONEDA ══ */
    /* ══ RENDER PROGRAMAS ══ */
    function renderProgramas(programas) {
        var grid = document.getElementById('programsGrid');
        if (!programas || programas.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#666;">No hay programas disponibles.</div>';
            return;
        }

        grid.innerHTML = programas.map(function(p) {
            var tipo        = (p.tipo || '').toLowerCase().replace('_', '');
            var estadoLabel = (p.estado || '').toLowerCase() === 'activo' ? 'Activo' : (p.estado || '—');
            var estadoColor = (p.estado || '').toUpperCase() === 'ACTIVO' ? 'var(--clr-success)' : '#9ca3af';
            var saldoColor  = (p.saldo || 0) >= 0 ? 'var(--clr-success)' : 'var(--clr-danger)';
            var pendColor   = (p.pendCooperadora || 0) > 0 ? 'var(--clr-warning)' : 'var(--clr-success)';

            return '<div class="program-card" data-tipo="' + tipo + '" onclick="navegar(\'cooperadora_4_cohortes.html?programa=' + p.id + '\')">'
                +   '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">'
                +     '<div class="program-icon">' + iconoTipo(p.tipo) + '</div>'
                +     '<span style="display:inline-flex;align-items:center;gap:5px;background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">'
                +       '<span style="width:7px;height:7px;border-radius:50%;background:' + estadoColor + ';display:inline-block;"></span>' + esc(estadoLabel)
                +     '</span>'
                +   '</div>'
                +   '<div class="program-name" style="margin-bottom:12px;">' + esc(p.nombre || '—') + '</div>'
                +   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:#555;margin-bottom:12px;">'
                +     '<div>Estudiantes: <strong>' + (p.estudiantes || 0) + '</strong></div>'
                +     '<div>Cohortes: <strong>' + (p.cohortes || 0) + '</strong></div>'
                +     '<div style="color:var(--clr-danger);">En mora: <strong>' + (p.enMora || 0) + '</strong></div>'
                +     '<div style="color:' + pendColor + ';">Pend. cooperadora: <strong>' + (p.pendCooperadora || 0) + '</strong></div>'
                +   '</div>'
                +   '<div style="border-top:1px solid #f0f0f0;padding-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:12px;">'
                +     '<div><div style="color:#888;margin-bottom:2px;">Recaudado</div><div style="font-weight:700;color:#5C1018;">' + fMontoDual(p.recaudadoARS, p.recaudadoUSD) + '</div></div>'
                +     '<div><div style="color:#888;margin-bottom:2px;">Egresos</div><div style="font-weight:700;color:var(--clr-warning);">' + fMontoDual(p.egresos, p.egresosUSD) + '</div></div>'
                +     '<div><div style="color:#888;margin-bottom:2px;">Saldo</div><div style="font-weight:700;color:' + saldoColor + ';">' + fMontoDual(p.saldo, p.saldoUSD) + '</div></div>'
                +   '</div>'
                + '</div>';
        }).join('');
    }

    /* ══ ACTUALIZAR BOTONES FILTRO ══ */
    function actualizarBotonesFiltro() {
        var tipos = { todos: 0, doctorado: 0, maestria: 0, especializacion: 0, micro_maestria: 0, diplomatura: 0, diplomado: 0, curso: 0 };
        tipos.todos = _programas.length;
        _programas.forEach(function(p) {
            var t = (p.tipo || '').toLowerCase();
            if (tipos[t] !== undefined) tipos[t]++;
        });

        /* Actualizar texto de botones de filtro */
        var btns = document.querySelectorAll('.filter-btn');
        btns.forEach(function(btn) {
            var onclick = btn.getAttribute('onclick') || '';
            var match = onclick.match(/filtrar\('([^']+)'\)/);
            if (!match) return;
            var key = match[1];
            if (key === 'todos') { btn.textContent = 'Todos (' + tipos.todos + ')'; return; }
            if (key === 'doctorado') { btn.textContent = 'Doctorados (' + (tipos.doctorado || 0) + ')'; return; }
            if (key === 'maestria') { btn.textContent = 'Maestrias (' + (tipos.maestria || 0) + ')'; return; }
            if (key === 'especializacion') { btn.textContent = 'Especializaciones (' + (tipos.especializacion || 0) + ')'; return; }
            if (key === 'micro') { btn.textContent = 'Micro Maestrias (' + ((tipos.micro_maestria || 0)) + ')'; return; }
            if (key === 'diplomatura') { btn.textContent = 'Diplomaturas (' + ((tipos.diplomatura || 0) + (tipos.diplomado || 0) + (tipos.curso || 0)) + ')'; return; }
        });
    }

    /* ══ FILTRAR ══ */
    function filtrar(tipo) {
        _filtroActivo = tipo;

        var buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(function(btn) { btn.classList.remove('active'); });
        if (event && event.target) event.target.classList.add('active');

        var tipoMap = {
            'doctorado':      ['DOCTORADO'],
            'maestria':       ['MAESTRIA'],
            'especializacion':['ESPECIALIZACION'],
            'micro':          ['MICRO_MAESTRIA'],
            'diplomatura':    ['DIPLOMADO', 'DIPLOMATURA', 'CURSO']
        };

        var filtrados = tipo === 'todos'
            ? _programas
            : _programas.filter(function(p) {
                var lista = tipoMap[tipo] || [];
                return lista.indexOf((p.tipo || '').toUpperCase()) >= 0;
            });

        renderProgramas(filtrados);
    }

    /* ══ INIT ══ */
    document.addEventListener('DOMContentLoaded', async function() {
        var sesion = await requireAuth();
        if (!sesion || sesion.rol !== 'COOPERADORA') { window.location.href = 'portal_login.html'; return; }

        Promise.all([
            obtenerDashboardAdmin(),
            obtenerNotificaciones('COOPERADORA')
        ]).then(function(resultados) {
            var dash = resultados[0] || {};
            var notifs = resultados[1] || [];

            _programas = dash.programas || [];
            actualizarBotonesFiltro();
            renderProgramas(_programas);
            renderNotificaciones(notifs);
        }).catch(function(err) {
            console.error('Error cargando programas:', err);
        });
    });
</script>
</body>
</html>
