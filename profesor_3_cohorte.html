<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohorte - Profesor</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body { font-family:'DM Sans',sans-serif; background:var(--bg); padding:0; font-size:14px; display:flex; flex-direction:column; height:125vh; overflow-x:auto; overflow-y:hidden; }

        /* HEADER */
        .page-header { background:linear-gradient(135deg,#5C1018 0%,#8C1A28 100%); color:white; padding:22px 28px; border-radius:12px 12px 0 0; display:flex; justify-content:space-between; align-items:center; gap:20px; }
        .header-left h1 { font-family:'Crimson Pro',serif; font-size:24px; margin-bottom:4px; }
        .header-left p  { opacity:0.85; font-size:13px; }
        .stat-row { display:flex; gap:20px; flex-shrink:0; align-items:flex-start; flex-wrap:wrap; }
        .stat-item { text-align:center; }
        .stat-label { font-size:10px; opacity:0.75; text-transform:uppercase; letter-spacing:0.5px; }
        .stat-value { font-size:22px; font-weight:700; margin-top:2px; }

        .btn-volver { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:white; padding:6px 13px; border-radius:8px; font-size:12px; cursor:pointer; font-family:'DM Sans',sans-serif; display:inline-flex; align-items:center; gap:5px; transition:background 0.2s; margin-bottom:10px; }
        .btn-volver:hover { background:rgba(255,255,255,0.22); }

        .notif-wrapper { position:relative; display:inline-block; }
        .notif-btn { background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.38); color:white; padding:8px 12px; border-radius:8px; font-size:18px; cursor:pointer; position:relative; transition:background .2s; }
        .notif-btn:hover { background:rgba(255,255,255,0.26); }
        #notif-badge { position:absolute; top:-4px; right:-4px; background:var(--clr-danger); color:white; border-radius:50%; min-width:18px; height:18px; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 3px; }
        #notif-dropdown { display:none; position:absolute; right:0; top:48px; width:320px; background:white; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:500; overflow:hidden; color:#2c2c2c; border:1px solid #e5e7eb; }
        .notif-head { padding:14px 16px; border-bottom:1px solid #f0f0f0; font-weight:700; color:#5C1018; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .notif-head button { background:none; border:none; color:#8C1A28; font-size:12px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }

        .btn-logout { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:white; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; display:inline-flex; align-items:center; gap:7px; transition:background 0.2s; }
        .btn-logout:hover { background:rgba(192,57,43,0.55); }

        /* READONLY BANNER */

        /* TOOLBAR */
        .toolbar { background:white; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #e0e0e0; gap:12px; flex-wrap:wrap; }
        .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .filter-label { font-weight:600; font-size:13px; white-space:nowrap; }
        .filter-btn { padding:6px 13px; border:2px solid #e0e0e0; background:white; border-radius:6px; font-size:12px; cursor:pointer; transition:all 0.2s; font-family:'DM Sans',sans-serif; white-space:nowrap; }
        .filter-btn:hover { border-color:var(--accent); }
        .filter-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
        .btn-export { padding:8px 14px; border:none; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s; font-family:'DM Sans',sans-serif; white-space:nowrap; background:var(--success); color:white; display:inline-flex; align-items:center; gap:5px; }
        .btn-export:hover { background:#246441; }

        /* TABLA */
        .table-wrapper { background:white; overflow:auto; flex:1; max-height:none; min-height:280px; }
        table { width:100%; border-collapse:collapse; font-size:12px; }
        thead { position:sticky; top:0; z-index:10; }
        th { padding:9px 6px; text-align:center; font-weight:600; border-bottom:2px solid #c5c5c5; border-right:1px solid #ddd; white-space:nowrap; font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:#555; background:#f0ede6; }
        th.col-name  { text-align:left; min-width:165px; padding-left:10px; position:sticky; left:0; z-index:11; background:#f0ede6; box-shadow:2px 0 4px rgba(0,0,0,0.08); }
        #t-body tr td.cell-name { position:sticky; left:0; z-index:2; background:white; box-shadow:2px 0 4px rgba(0,0,0,0.07); }
        th.col-email { text-align:left; min-width:175px; padding-left:8px; }
        th.col-cuota { min-width:82px; }
        th.tot-hdr   { color:white; font-size:10px; min-width:100px; }
        th.th-pagar   { background:#3730a3; }
        th.th-abonado { background:var(--clr-success); }
        th.th-saldo   { background:var(--clr-danger); }
        td { padding:9px 6px; border-bottom:1px solid #ebebeb; border-right:1px solid #ebebeb; vertical-align:middle; }
        tr.oculta { display:none; }
        .cell-name  { font-weight:700; color:var(--primary); padding-left:10px; white-space:nowrap; cursor:pointer; }
        .cell-name:hover { text-decoration:underline; }
        .cell-desc  { text-align:center; font-weight:600; }
        .cell-email { font-size:11px; color:#8C1A28; padding-left:8px; }

        td[data-est="ABONADA"]      { background:#d4edda; color:#1e7e44; text-align:center; font-weight:600; }
        td[data-est="PAGO_PARCIAL"] { background:#fff8e1; color:#78350f; text-align:center; font-weight:600; font-size:10px; }
        td[data-est="EN_MORA"]      { background:#f8d7da; color:var(--clr-danger); text-align:center; font-weight:600; }
        td[data-est="PENDIENTE"]    { background:#f0f0f0; color:#666;    text-align:center; font-weight:600; }
        td[data-est="NO_APLICA"]    { background:#fafafa; color:#ccc; font-style:italic; font-size:10px; border:1px dashed #e0e0e0; text-align:center; }
        td[data-est="NO_ABONADA"]  { background:#eef2ff; color:#4338ca; text-align:center; font-weight:600; }
        td[data-est="A_DEFINIR"]   { background:#f3f4f6; color:#6b7280; text-align:center; font-weight:600; font-style:italic; }

        .est-badge { display:block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; margin-bottom:3px; }
        .badge-mora      { background:#fecdd3; color:#9f1239; }
        .badge-noabonada { background:#bfdbfe; color:#1e40af; }
        .badge-parcial   { background:#fde68a; color:#92400e; }
        .badge-pendiente { background:#fef08a; color:#713f12; }

        .cell-tot-pagar   { background:#eef2ff; color:#5C1018; font-weight:700; text-align:right; padding-right:10px; white-space:nowrap; }
        .cell-tot-abonado { background:#d4edda; color:#1e7e44; font-weight:700; text-align:right; padding-right:10px; white-space:nowrap; }
        .cell-saldo-pos   { background:#f8d7da; color:var(--clr-danger); font-weight:700; text-align:right; padding-right:10px; white-space:nowrap; }
        .cell-saldo-cero  { background:#d4edda; color:#1e7e44; font-weight:700; text-align:right; padding-right:10px; white-space:nowrap; }

        /* LEYENDA */
        .leyenda { background:white; padding:12px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; border-top:1px solid #e8e8e8; font-size:12px; color:#555; border-radius:0 0 12px 12px; box-shadow:0 4px 16px rgba(0,0,0,0.07); }
        .ley-item { display:flex; align-items:center; gap:5px; }
        .ley-box { width:18px; height:13px; border-radius:3px; flex-shrink:0; }
        .ley-abonada   { background:#d4edda; border:1px solid #b8dcc7; }
        .ley-parcial   { background:#fff3cd; border:1px solid #ffe082; }
        .ley-mora      { background:#f8d7da; border:1px solid #f1a8b0; }
        .ley-pendiente { background:#f0f0f0; border:1px solid #d0d0d0; }
        .ley-noabonada { background:#eef2ff; border:1px solid #c7d2fe; }
        .ley-adefinir  { background:#f3f4f6; border:1px solid #d1d5db; }
        .ley-nodebe    { background:#fafafa; border:1px dashed #d0d0d0; }

        /* EMPTY */
        .empty-state { display:none; text-align:center; padding:60px 20px; color:#aaa; }
        .empty-state.show { display:block; }

        /* SPINNER */
        .spinner-overlay { display:none; position:fixed; inset:0; background:rgba(255,255,255,0.78); z-index:9000; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
        .spinner-overlay.show { display:flex; }
        .spinner { width:42px; height:42px; border:4px solid #e0e0e0; border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* CELL LINKS */
        .cell-links { display:flex; gap:3px; margin-top:4px; justify-content:center; flex-wrap:wrap; }
        .clink { border:none; border-radius:3px; padding:2px 5px; font-size:10px; font-weight:600; cursor:pointer; font-family:inherit; line-height:1.4; text-decoration:none; display:inline-block; }
        .clink-comp   { background:#e0e7ff; color:#4338ca; }
        .clink-recibo { background:#fef3c7; color:#92400e; }

        @media(max-width:680px){ body{ padding:10px; } .page-header{ padding:16px; border-radius:8px 8px 0 0; } }
            #app { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
        .leyenda { flex-shrink:0; }
        .page-header { flex-shrink:0; }
        .toolbar { flex-shrink:0; }
    </style>

</head>
<body>

<div class="spinner-overlay" id="spinner"><div class="spinner"></div><span style="color:#5C1018;font-weight:600;font-size:14px;">Cargando...</span></div>

<div id="app">

<!-- HEADER -->
<div class="page-header">

        <button class="btn-volver" onclick="history.back()">← Volver</button>

            <span id="hdr-cohorte" style="background:rgba(255,255,255,0.18);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:0.03em;"></span>
            <p id="hdr-sub" style="font-size:13px;opacity:0.85;"></p>
        </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:14px;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="notif-wrapper">
                <button class="notif-btn" onclick="toggleNotif()" title="Notificaciones">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span id="notif-badge"></span>
                </button>
                <div id="notif-dropdown">
                    <div class="notif-head"><span>🔔 Notificaciones</span><button onclick="marcarTodasLeidas()">Marcar leídas</button></div>
                    <div id="notif-list" style="max-height:320px;overflow-y:auto;"><div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">Cargando…</div></div>
                </div>

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Cerrar sesión
            </button>
        </div>
        <div class="stat-row">
            <div class="stat-item"><div class="stat-label">Total</div><div class="stat-value" id="s-total">—</div></div>
            <div class="stat-item"><div class="stat-label">Activos</div><div class="stat-value" id="s-activos">—</div></div>
            <div class="stat-item"><div class="stat-label">Bajas</div><div class="stat-value" id="s-bajas" style="color:#9ca3af;">—</div></div>
            <div class="stat-item"><div class="stat-label">Cancela carrera</div><div class="stat-value" id="s-cancela">—</div></div>
            <div class="stat-item"><div class="stat-label">Pendiente</div><div class="stat-value" id="s-pendiente" style="color:#2563eb;">—</div></div>
            <div class="stat-item"><div class="stat-label">En mora</div><div class="stat-value" id="s-mora" style="color:#ffc107;">—</div></div>
            <div class="stat-item"><div class="stat-label">Cuotas en mora</div><div class="stat-value" id="s-mora-cuotas" style="color:#ffc107;">—</div></div>
            <div class="stat-item"><div class="stat-label">Al día</div><div class="stat-value" id="s-aldia" style="color:#16a34a;">—</div></div>
            <div class="stat-item"><div class="stat-label">Readmisión</div><div class="stat-value" id="s-readmision" style="color:#6f42c1;">—</div></div>
            <div class="stat-item"><div class="stat-label">Ingresos</div><div class="stat-value" id="s-recaudado">—</div></div>
            <div class="stat-item"><div class="stat-label">Egresos</div><div class="stat-value" id="s-egresos" style="color:var(--clr-warning);">—</div></div>
            <div class="stat-item"><div class="stat-label">Saldo</div><div class="stat-value" id="s-saldo">—</div></div>
        </div>
    </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
    <div class="filters" id="filtros">
        <span class="filter-label">Filtrar:</span>
        <button class="filter-btn active" data-f="todos">Todos</button>
        <button class="filter-btn" data-f="ABONADA">Al día</button>
        <button class="filter-btn" data-f="EN_MORA">En mora</button>
        <button class="filter-btn" data-f="PAGO_PARCIAL">Pago parcial</button>
        <button class="filter-btn" data-f="PENDIENTE">Pendiente</button>
        <button class="filter-btn" data-f="NO_ABONADA">No abonada</button>
        <button class="filter-btn" data-f="A_DEFINIR">A definir</button>
    </div>

        <button class="btn-export" onclick="exportarExcel()">📊 Exportar a Excel</button>
    </div>
</div>

<!-- TABLA -->
<div class="table-wrapper">
    <table id="tabla">
        <thead id="t-head"></thead>
        <tbody id="t-body"></tbody>
    </table>
    <div class="empty-state" id="empty"><div style="font-size:48px;margin-bottom:12px;">🔍</div><div style="font-size:15px;font-weight:600;color:#666;">Sin resultados para este filtro</div></div>
</div>

<!-- LEYENDA -->
<div class="leyenda">
    <strong style="color:#333;">Leyenda:</strong>
    <div class="ley-item"><span class="ley-box ley-abonada"></span> Abonada</div>
    <div class="ley-item"><span class="ley-box ley-parcial"></span> Pago Parcial</div>
    <div class="ley-item"><span class="ley-box ley-mora"></span> En Mora</div>
    <div class="ley-item"><span class="ley-box ley-pendiente"></span> Pendiente</div>
    <div class="ley-item"><span class="ley-box ley-noabonada"></span> No abonada</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="supabase.js?v=20250529"></script>
<script src="cohorte_tabla.js?v=20250603"></script>
<script>
var COHORTE_ID = parseInt(new URLSearchParams(location.search).get('cohorte_id'), 10) || 0;
var V = { data: null, filtro: 'todos', recibosTangoMap: {} };

function escHtml(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fMonto(n) { var num=parseFloat(n||0); if(isNaN(num))return '$0,00'; return (num<0?'-$':'$')+Math.abs(num).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// fMillones: ahora en supabase.js (monto completo)
function spin(on) { document.getElementById('spinner').classList.toggle('show', on); }

/* ── NOTIFICACIONES ── */
var _notifs = [];document.addEventListener('click', function(e){ var w=document.querySelector('.notif-wrapper'); if(w&&!w.contains(e.target)){var dd=document.getElementById('notif-dropdown');if(dd)dd.style.display='none';} });
// renderNotificaciones / leerNotif / marcarTodasLeidas: usa supabase.js

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', async function() {
    var _sb = await getSupabase();
    var { data: { session: _session } } = await _sb.auth.getSession();
    if (!_session) { window.location.href = 'portal_login.html'; return; }
    var sesion = getSesion();
    if (!sesion || sesion.rol !== 'PROFESOR') { window.location.href = 'portal_login.html'; return; }
    if (!COHORTE_ID) { alert('Cohorte no especificada.'); history.back(); return; }
    if (typeof obtenerNotificaciones === 'function') obtenerNotificaciones('PROFESOR').then(renderNotificaciones);
    initFiltros();
    try { await cargar(sesion); } catch(e) { spin(false); console.error(e); alert('Error al cargar: ' + e.message); }
});

/* ── CARGAR DATOS ── */
async function cargar(sesion) {
    spin(true);
    try {
        var sb = await getSupabase();
        var [rCoh, rCob, rInsc, rEst, rEgr] = await Promise.all([
            sb.from('cohortes').select('*, programas(nombre)').eq('cohorte_id', COHORTE_ID).single(),
            sbFetchAll(function() { return sb.from('cobros').select('cobro_id,dni,concepto,periodo,fecha_vencimiento,monto_original,descuento_porcentaje,monto_final,monto_abonado,monto_transferido,saldo_pendiente,estado,moneda,no_aplica,comprobante_url,recibo_url,fecha_pago').eq('cohorte_id', COHORTE_ID).order('fecha_vencimiento'); }),
            obtenerInscripcionesPorCohorte(COHORTE_ID, 'estudiante_id, descuento_porcentaje, estado_academico'),
            sb.from('estudiantes').select('id,dni,nombre,apellido,email'),
            obtenerEgresosResumenPorCohorte(COHORTE_ID)
        ]);

        var cohorte = rCoh.data || {};

        // Control de acceso por cohorte: programa completo o cohorte específica asignada
        var asig = await obtenerAsignacionesCoordinador(sesion.dni);
        var pidNum = parseInt(cohorte.programa_id, 10);
        var tieneAcceso = (asig.progIds || []).indexOf(pidNum) >= 0 || (asig.progIds || []).indexOf(cohorte.programa_id) >= 0 || (asig.cohIds || []).indexOf(COHORTE_ID) >= 0;
        if (!tieneAcceso) { spin(false); alert('No tenés acceso a esta cohorte.'); history.back(); return; }

        var cobros  = rCob.data || [];
        var inscripciones = rInsc;
        var estList = rEst.data || [];

        var estByDni = {};
        estList.forEach(function(e){ estByDni[String(e.dni)] = e; });
        var inscById = {};
        inscripciones.forEach(function(i){ inscById[i.estudiante_id] = i; });

        var dniMap = {};
        cobros.forEach(function(c){
            var dk = String(c.dni);
            if (!dniMap[dk]) {
                var est = estByDni[dk] || {};
                var insc = est.id ? (inscById[est.id] || {}) : {};
                dniMap[dk] = { id:est.id||null, dni:c.dni, apellido:est.apellido||dk, nombre:est.nombre||'', email:est.email||'', descuento_porcentaje:insc.descuento_porcentaje||0, estado_academico:insc.estado_academico||'ACTIVO', cobros:[] };
            }
            var abonado = calcMontoAbonado(c);
            dniMap[dk].cobros.push(normalizarCobro({ cobro_id:c.cobro_id, concepto:c.concepto||'', periodo:c.periodo||'', fecha_vencimiento:c.fecha_vencimiento||'', monto_original:Number(c.monto_original||c.monto_final||0), descuento_porcentaje:Number(c.descuento_porcentaje||0), monto_final:c.monto_final!=null?Number(c.monto_final):null, monto_abonado:abonado, saldo_pendiente:Number(c.saldo_pendiente||0), estado:c.no_aplica?'NO_APLICA':(c.estado||'NO_ABONADA'), moneda:c.moneda||'ARS', comprobante_url:c.comprobante_url||null, recibo_url:c.recibo_url||null, fecha_pago:c.fecha_pago||null }));
        });

        inscripciones.forEach(function(insc){
            var est = estList.find(function(e){return e.id===insc.estudiante_id;});
            if(!est)return;
            var dk=String(est.dni);
            if(dniMap[dk])return;
            dniMap[dk]={id:est.id||null,dni:est.dni,apellido:est.apellido||dk,nombre:est.nombre||'',email:est.email||'',descuento_porcentaje:insc.descuento_porcentaje||0,estado_academico:insc.estado_academico||'ACTIVO',cobros:[]};
        });

        var progNombre = cohorte.programas ? cohorte.programas.nombre : (cohorte.programa_id ? 'Programa' : '—');
        var listaEst = Object.values(dniMap).sort(function(a,b){
            var r = String(a.apellido||'').localeCompare(String(b.apellido||''), 'es', { sensitivity:'base' });
            return r !== 0 ? r : String(a.nombre||'').localeCompare(String(b.nombre||''), 'es', { sensitivity:'base' });
        });
        V.data = {
            programa: { nombre: progNombre, programaId: cohorte.programa_id || null },
            cohorte:  { cohorteId: COHORTE_ID, nombre: cohorte.nombre || 'Cohorte', fecha_inicio: cohorte.fecha_inicio||'', fecha_fin: cohorte.fecha_fin||'' },
            columnas: derivarColumnas(listaEst),
            estudiantes: listaEst,
            egresos: rEgr || []
        };
        var _cobroIds = [];
        cobros.forEach(function(c){ if(c.cobro_id) _cobroIds.push(c.cobro_id); });
        V.recibosTangoMap = await obtenerRecibosTango(_cobroIds);
        renderHeader();
        renderTabla();
        actualizarStats();
        actualizarFiltros();
    } finally {
        spin(false);
    }
}

/* ── NORMALIZAR COBRO ── */
function normalizarCobro(c) {
    var concepto = c.concepto || 'Cuota';
    var montoOriginal = c.monto_original != null ? Number(c.monto_original) : (c.monto_final != null ? Number(c.monto_final) : null);
    var montoAbonado  = c.monto_abonado  != null ? Number(c.monto_abonado)  : 0;
    var montoFinal    = c.monto_final    != null ? Number(c.monto_final)    : montoOriginal;
    var saldo         = c.saldo_pendiente != null ? Number(c.saldo_pendiente) : (montoFinal != null ? Math.max(0, montoFinal - montoAbonado) : 0);
    var descuento     = Number(c.descuento_porcentaje || 0);
    var fechaVto      = c.fecha_vencimiento || '';
    var estadoExpl    = String(c.estado || '').toUpperCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'');
    // Estado unificado: una sola fuente de verdad → resolverEstadoCobro (cohorte_tabla.js)
    var noAplica = ['NO_APLICA','NO APLICA','NO_DEBE','NO DEBE'].includes(estadoExpl);
    var estado = resolverEstadoCobro({
        no_aplica: noAplica,
        monto_final: montoFinal,
        saldo_pendiente: saldo,
        monto_abonado: montoAbonado,
        estado: estadoExpl,
        fecha_vencimiento: fechaVto,
        comprobante_url: c.comprobante_url || null,
        recibo_url: c.recibo_url || null
    });
    return { cobro_id:c.cobro_id||'', concepto:concepto, concepto_base:concepto, periodo:c.periodo||'', fecha_vencimiento:fechaVto, fecha_pago:c.fecha_pago||'', monto_original:montoOriginal, descuento_porcentaje:descuento, monto_final:montoFinal, monto_abonado:montoAbonado, saldo_pendiente:saldo, estado:estado, moneda:c.moneda||'ARS', no_aplica:estado==='NO_APLICA', comprobante_url:c.comprobante_url||null, recibo_url:c.recibo_url||null };
}

/* ── DERIVAR COLUMNAS ── */
function derivarColumnas(estudiantes) {
    var mapa = new Map();
    estudiantes.forEach(function(est) {
        est.cobros.forEach(function(c) {
            if (!c) return;
            var key = (c.concepto_base||c.concepto) + '||' + (c.periodo||'');
            if (!mapa.has(key)) mapa.set(key, { concepto_base:c.concepto_base||c.concepto, periodo:c.periodo||'', fecha_vencimiento:c.fecha_vencimiento||'' });
        });
    });
    return [...mapa.values()].sort(function(a,b){ return String(a.fecha_vencimiento||'9999-12-31').localeCompare(String(b.fecha_vencimiento||'9999-12-31')); });
}

/* ── RENDER HEADER ── */
function renderHeader() {
    var d = V.data;
    document.getElementById('hdr-programa').textContent = d.programa.nombre;
    document.getElementById('hdr-cohorte').textContent  = d.cohorte.nombre;
    var partes = [d.estudiantes.length + ' estudiante' + (d.estudiantes.length !== 1 ? 's' : '')];
    if (d.cohorte.fecha_inicio || d.cohorte.fecha_fin) partes.push((d.cohorte.fecha_inicio||'—') + ' → ' + (d.cohorte.fecha_fin||'—'));
    document.getElementById('hdr-sub').textContent = partes.join(' • ');
}

/* ── RENDER TABLA ── */
/* renderTabla → cohorte_tabla.js (esqueleto). Esta vista aporta su HTML
   específico (solo lectura) vía CT_VIEW. */
var CT_VIEW = {
    leadingHeader:
          '<th class="col-name">Apellido y Nombre</th>'
        + '<th style="min-width:74px;text-align:center;">Desc %</th>'
        + '<th class="col-email">Correo electrónico</th>',

    totales: function(est) {
        // ARS y USD nunca se suman; los totales USD se guardan aparte (est._totUsd)
        var pA=0,aA=0,sA=0,pU=0,aU=0,sU=0;
        est.cobros.forEach(function(c){ if(c){
            var mf=Number(c.monto_final||0), ma=Number(c.monto_abonado||0), sp=Number(c.saldo_pendiente||0);
            if (c.moneda==='USD') { pU+=mf; aU+=ma; sU+=sp; } else { pA+=mf; aA+=ma; sA+=sp; }
        }});
        est._totUsd = { p:pU, a:aU, s:sU };
        return { p: pA, a: aA, s: sA };
    },

    celdaVacia: function(est, col) {
        return '<td data-est="A_DEFINIR" title="Sin cobro generado para esta cuota"><span style="color:var(--clr-warning);font-size:10px;font-style:italic;">A definir</span></td>';
    },

    celda: function(c, est, estado, montoAbonado, col) {
        var txt = '';
        if      (estado === 'NO_APLICA')      txt = '— no aplica';
        else if (estado === 'A_DEFINIR')      txt = 'A definir';
        else if (estado === 'PAGO_PARCIAL')   txt = fMonto(montoAbonado, c.moneda)+'<br><small style="font-size:9px;opacity:.8;">de '+fMonto(c.monto_final, c.moneda)+'</small>';
        else if (estado === 'PENDIENTE') {
            var mt = c.monto_transferido && Number(c.monto_transferido) > 0 ? Number(c.monto_transferido) : null;
            if (mt && mt < Number(c.monto_final||0)) {
                var faltaP = Math.max(0, Number(c.monto_final||0) - mt);
                txt = fMonto(mt, c.moneda)+'<br><small style="font-size:9px;opacity:.8;">de '+fMonto(c.monto_final, c.moneda)+' · falta '+fMonto(faltaP, c.moneda)+'</small><br><small style="font-size:9px;opacity:.7;">🕓 parcial en revisión</small>';
            } else {
                txt = '🕓 En revisión';
            }
        }
        else txt = fMonto(c.monto_final, c.moneda);
        var title = escHtml(c.concepto+' · '+(c.periodo||'')+' | Estado: '+estado+' | Abonado: '+fMonto(montoAbonado, c.moneda)+' | Saldo: '+fMonto(c.saldo_pendiente, c.moneda)+(c.fecha_vencimiento?' | Vence: '+c.fecha_vencimiento:''));
        var btnComp   = c.comprobante_url ? '<button class="clink clink-comp" onclick="verArchivo(\''+escJs(c.comprobante_url)+'\')" title="Ver comprobante">📎 Comp.</button>' : '';
        var _recs = V.recibosTangoMap[c.cobro_id] || [];
        var btnRecibo = _recs.map(function(r,i){ var lbl=_recs.length>1?'🧾 Recibo '+(i+1):'🧾 Recibo'; return '<button class="clink clink-recibo" onclick="verArchivo(\''+escJs(r.pdf_url)+'\')" title="Recibo N°'+(r.nro_recibo||String(i+1))+'">'+lbl+'</button>'; }).join('');
        var links = (btnComp||btnRecibo) ? '<div class="cell-links">'+btnComp+btnRecibo+'</div>' : '';
        var badge = '';
        if      (estado === 'EN_MORA')      badge = '<span class="est-badge badge-mora">En mora</span>';
        else if (estado === 'NO_ABONADA')   badge = '<span class="est-badge badge-noabonada">No abonada</span>';
        else if (estado === 'PAGO_PARCIAL') badge = '<span class="est-badge badge-parcial">Pago parcial</span>';
        else if (estado === 'PENDIENTE')    badge = '<span class="est-badge badge-pendiente">En revisión</span>';
        return '<td data-est="'+estado+'" title="'+title+'">'+badge+txt+links+'</td>';
    },

    fila: function(est, estadoGen, celdas, totP, totA, totS) {
        var tr = document.createElement('tr');
        tr.className = 'fila-est';
        tr.dataset.dni = est.dni;
        tr.dataset.est = estadoGen;
        var progId = V.data.programa.programaId;
        tr.innerHTML = '<td class="cell-name" onclick="navegar(\'detalle_estudiante_cohorte.html?dni='+encodeURIComponent(String(est.dni))+'&cohorte_id='+COHORTE_ID+(progId?'&programa_id='+progId:'')+'\')">'+escHtml(est.apellido)+', '+escHtml(est.nombre)+'</td>'
            + '<td class="cell-desc" style="color:'+( est.descuento_porcentaje>0 ? 'var(--success)':'#aaa')+'">'+est.descuento_porcentaje+'%</td>'
            + '<td class="cell-email">'+escHtml(est.email)+'</td>'
            + celdas
            + '<td class="cell-tot-pagar">'+fMontoDual(totP, (est._totUsd||{}).p)+'</td>'
            + '<td class="cell-tot-abonado">'+fMontoDual(totA, (est._totUsd||{}).a)+'</td>'
            + '<td class="'+(totS===0 && !((est._totUsd||{}).s)?'cell-saldo-cero':'cell-saldo-pos')+'">'+fMontoDual(totS, (est._totUsd||{}).s)+'</td>';
        return tr;
    }
};

/* ── EXPORT ── */
function exportarExcel() {
    if (!V.data) return;
    var d = V.data;
    var cols = d.columnas;
    var header = ['Apellido', 'Nombre', 'Desc%', 'Email', 'Moneda'].concat(cols.map(function(c){ return c.concepto_base + (c.periodo?' '+c.periodo:''); })).concat(['Total a Pagar','Total Abonado','Saldo Pendiente']);
    var rows = [header];
    d.estudiantes.forEach(function(est) {
        var cobrosMap = {};
        est.cobros.forEach(function(c){ if(c) cobrosMap[(c.concepto_base||c.concepto)+'||'+(c.periodo||'')] = c; });
        // ARS y USD no se suman: si el estudiante mezcla, se marca y los totales no se computan juntos
        var monedasEst = {};
        est.cobros.forEach(function(c){ if(c) monedasEst[c.moneda||'ARS']=true; });
        var monedaList = Object.keys(monedasEst);
        var monedaLabel = monedaList.length > 1 ? '⚠ MIXTA' : (monedaList[0] || 'ARS');
        var row = [est.apellido, est.nombre, est.descuento_porcentaje+'%', est.email, monedaLabel];
        var totP=0, totA=0, totS=0;
        cols.forEach(function(col) {
            var c = cobrosMap[col.concepto_base+'||'+(col.periodo||'')];
            if (!c) { row.push('no debe'); return; }
            totP += Number(c.monto_final||0); totA += Number(c.monto_abonado||0); totS += Number(c.saldo_pendiente||0);
            row.push(c.estado === 'ABONADA' ? Number(c.monto_final) : c.estado === 'PAGO_PARCIAL' ? Number(c.monto_abonado)+'/'+Number(c.monto_final) : c.estado);
        });
        row.push(totP, totA, totS);
        rows.push(row);
    });
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Cohorte');
    XLSX.writeFile(wb, 'cohorte_'+COHORTE_ID+'.xlsx');
}

/* ── UTIL ── */
function escJs(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
