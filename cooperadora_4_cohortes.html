<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohortes - Esp. Costos</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }



        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg); font-size: 14px;
        }

        .header {
            background: linear-gradient(135deg, #5C1018 0%, #8C1A28 100%);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .breadcrumb {
            font-size: 14px;
            margin-bottom: 12px;
        }

        .breadcrumb a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 13px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .breadcrumb a:hover {
            background: rgba(255,255,255,0.25);
        }

        .header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 28px;
            margin-bottom: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 24px;
        }

        .page-title {
            font-family: 'Crimson Pro', serif;
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .page-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .cohortes-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cohorte-card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cohorte-card:hover {
            border-color: var(--accent);
            transform: translateX(8px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .cohorte-card.active {
            border-color: var(--accent);
            background: linear-gradient(90deg, #fff9e6 0%, white 30%);
        }

        .cohorte-left {
            flex: 1;
        }

        .cohorte-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .cohorte-dates {
            color: #666;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .cohorte-stats {
            display: flex;
            gap: 32px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-value.success {
            color: var(--success);
        }

        .stat-value.warning {
            color: var(--warning);
        }

        .stat-value.danger {
            color: var(--danger);
        }

        .cohorte-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.active {
            background: #d4edda;
            color: var(--success);
        }

        .badge.closed {
            background: #e8e8e8;
            color: #666;
        }

        .arrow {
            font-size: 28px;
            color: var(--accent);
            transition: transform 0.3s ease;
        }

        .cohorte-card:hover .arrow {
            transform: translateX(8px);
        }

        .btn-toggle {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
        }
        .btn-toggle.cerrar {
            background: white;
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-toggle.cerrar:hover {
            background: var(--danger);
            color: white;
        }
        .btn-toggle.activar {
            background: white;
            border-color: var(--success);
            color: var(--success);
        }
        .btn-toggle.activar:hover {
            background: var(--success);
            color: white;
        }
        .saldo-positivo { color: var(--success); font-weight: 700; }
        .saldo-negativo { color: var(--danger); font-weight: 700; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .btn-logout { padding: 8px 18px; background: transparent; color: white; border: 2px solid rgba(255,255,255,0.7); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s, border-color 0.2s; opacity: 1; }
        .btn-logout:hover { background: rgba(255,255,255,0.15); border-color: white; }
    </style>
    <link rel="stylesheet" href="sigpo-theme.css?v=20250529">
    <link rel="stylesheet" href="sigpo-compact.css?v=20250529">
</head>
<body>
    <div class="header">
        <div class="header-content" style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
                <div class="breadcrumb">
                    <a href="cooperadora_3_programas.html">← Volver a Programas</a>
                </div>

                <p>Selecciona una cohorte para ver sus estudiantes</p>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
                <div class="notif-wrapper" style="position:relative;">
                    <button onclick="toggleNotif()" title="Notificaciones" style="background:none;border:none;cursor:pointer;position:relative;padding:8px;border-radius:8px;">
                        <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#C49A2A"/></svg>
                        <span id="notif-badge" style="position:absolute;top:2px;right:2px;background:var(--clr-danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #5C1018;line-height:1;">0</span>
                    </button>
                    <div id="notif-dropdown" style="display:none;position:absolute;top:calc(100% + 10px);right:0;width:380px;max-height:460px;overflow-y:auto;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);z-index:999;border:1px solid #e5e7eb;">
                        <div style="padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
                            <h3 style="font-size:15px;font-weight:700;color:#5C1018;">🔔 Notificaciones</h3>
                            <button onclick="marcarTodasLeidas()" style="font-size:12px;color:#C49A2A;cursor:pointer;background:none;border:none;font-weight:600;font-family:'DM Sans',sans-serif;">Marcar todas como leídas</button>
                        </div>
                        <div id="notif-list"><div style="padding:32px 20px;text-align:center;color:#9ca3af;font-size:14px;">Cargando…</div></div>
                    </div>
                </div>
                <a href="portal_login.html" onclick="return cerrarSesion(event)" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.35);color:white;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title">Cohortes Disponibles</h1>
        <p class="page-subtitle">5 cohortes • 42 estudiantes totales</p>

        <div class="cohortes-list" id="cohortes-list">
            <!-- skeleton loaders -->
            <div class="cohorte-card" style="animation:pulse 1.4s ease-in-out infinite;">
                <div class="cohorte-left">
                    <div style="height:22px;width:200px;background:#e5e7eb;border-radius:6px;margin-bottom:10px;"></div>
                    <div style="height:14px;width:280px;background:#e5e7eb;border-radius:4px;margin-bottom:16px;"></div>
                    <div style="display:flex;gap:32px;">
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:80px;background:#e5e7eb;border-radius:6px;"></div>
                    </div>
                </div>
                <div style="height:32px;width:80px;background:#e5e7eb;border-radius:20px;"></div>
            </div>
            <div class="cohorte-card" style="animation:pulse 1.4s ease-in-out infinite;animation-delay:.2s;">
                <div class="cohorte-left">
                    <div style="height:22px;width:180px;background:#e5e7eb;border-radius:6px;margin-bottom:10px;"></div>
                    <div style="height:14px;width:260px;background:#e5e7eb;border-radius:4px;margin-bottom:16px;"></div>
                    <div style="display:flex;gap:32px;">
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:80px;background:#e5e7eb;border-radius:6px;"></div>
                    </div>
                </div>
                <div style="height:32px;width:80px;background:#e5e7eb;border-radius:20px;"></div>
            </div>
            <div class="cohorte-card" style="animation:pulse 1.4s ease-in-out infinite;animation-delay:.4s;">
                <div class="cohorte-left">
                    <div style="height:22px;width:160px;background:#e5e7eb;border-radius:6px;margin-bottom:10px;"></div>
                    <div style="height:14px;width:240px;background:#e5e7eb;border-radius:4px;margin-bottom:16px;"></div>
                    <div style="display:flex;gap:32px;">
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:70px;background:#e5e7eb;border-radius:6px;"></div>
                        <div style="height:40px;width:80px;background:#e5e7eb;border-radius:6px;"></div>

                </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js?v=20250529"></script>
<script>
var _programaId = new URLSearchParams(location.search).get('programa') || new URLSearchParams(location.search).get('programaId') || '';
var _cohortes = [];

function irACohorte(cohorteId, event) {
    if (event) event.stopPropagation();
    navegar('cooperadora_5_cohorte.html?programa=' + _programaId + '&cohorte=' + cohorteId);
}

function toggleEstado(cohorteId, nuevoEstado, event) {
    if (event) event.stopPropagation();
    var accion = nuevoEstado === 'ACTIVO' ? 'activar' : 'cerrar';
    if (!confirm('¿Querés ' + accion + ' esta cohorte?')) return;
    getSupabase().then(function(sb) {
        sb.from('cohortes').update({ estado: nuevoEstado }).eq('cohorte_id', cohorteId).then(function() {
            cargarCohortes();
        });
    });
}

function renderCohortes(data) {
    var programa = data || {};
    var cohortes = programa.cohortes || [];
    _cohortes = cohortes;

    var nombreProg = programa.nombre || 'Cohortes';
    document.getElementById('header-programa-nombre').textContent = '💼 ' + nombreProg;
    document.querySelector('.page-title').textContent = nombreProg;
    var total = cohortes.reduce(function(s, c) { return s + (c.estudiantes || 0); }, 0);
    document.querySelector('.page-subtitle').textContent = cohortes.length + ' cohortes • ' + total + ' estudiantes totales';

    var lista = document.getElementById('cohortes-list');
    if (!cohortes.length) {
        lista.innerHTML = '<div style="padding:40px;text-align:center;color:#999;">No hay cohortes registradas para este programa</div>';
        return;
    }

    lista.innerHTML = cohortes.map(function(c) {
        var esActiva = c.estado === 'ACTIVO';
        var saldo = (c.recaudado || 0) - (c.egresos || 0);
        return '<div class="cohorte-card' + (esActiva ? ' active' : '') + '" onclick="irACohorte(' + c.id + ', event)">'
            + '<div class="cohorte-left">'
            + '<div class="cohorte-title">' + esc(c.nombre || 'Cohorte') + '</div>'
            + '<div class="cohorte-dates">' + esc(c.fechaInicio || '') + ' – ' + esc(c.fechaFin || '') + '</div>'
            + '<div class="cohorte-stats">'
            + '<div class="stat-box"><div class="stat-label">ESTUDIANTES</div><div class="stat-value">' + (c.estudiantes || 0) + '</div></div>'
            + '<div class="stat-box"><div class="stat-label">AL DÍA</div><div class="stat-value" style="color:var(--clr-success)">' + (c.alDia || 0) + '</div></div>'
            + '<div class="stat-box"><div class="stat-label">EN MORA</div><div class="stat-value" style="color:' + ((c.enMora || 0) > 0 ? 'var(--clr-danger)' : '#999') + '">' + (c.enMora || 0) + '</div></div>'
            + '<div class="stat-box"><div class="stat-label">RECAUDADO</div><div class="stat-value">' + fM(c.recaudado) + '</div></div>'
            + '<div class="stat-box"><div class="stat-label">EGRESOS</div><div class="stat-value" style="color:var(--clr-warning)">' + fM(c.egresos) + '</div></div>'
            + '<div class="stat-box"><div class="stat-label">SALDO</div><div class="stat-value" style="color:' + (saldo >= 0 ? 'var(--clr-success)' : 'var(--clr-danger)') + '">' + fM(saldo) + '</div></div>'
            + '</div></div>'
            + '<div class="cohorte-right">'
            // Cooperadora no gestiona cohortes (abrir/cerrar es del administrador): solo lectura.
            + '<span class="badge ' + (esActiva ? 'active' : 'closed') + '">' + (esActiva ? 'Activa' : 'Cerrada') + '</span>'
            + '<span class="arrow">→</span>'
            + '</div></div>';
    }).join('');
}

function cargarCohortes() {
    obtenerDetallePrograma(_programaId).then(function(data) {
        renderCohortes(data);
    }).catch(function(e) {
        console.error(e);
        document.querySelector('.cohortes-list').innerHTML = '<div style="padding:40px;text-align:center;color:var(--clr-danger);">Error al cargar cohortes</div>';
    });
}

document.addEventListener('DOMContentLoaded', async function() {
    var sesion = await requireAuth();
    if (!sesion || sesion.rol !== 'COOPERADORA') { window.location.href = 'portal_login.html'; return; }
    if (_programaId) cargarCohortes();
    else document.querySelector('.cohortes-list').innerHTML = '<div style="padding:40px;text-align:center;color:#999;">No se especificó un programa</div>';
    obtenerNotificaciones('COOPERADORA').then(renderNotificaciones);
});
        
    /* Navegación y sesión proporcionadas por supabase.js */
    
        /* ══ CAMPANA ══ */
    var _notifs = [];    document.addEventListener('click', function(e) { var w = document.querySelector('.notif-wrapper'); if (w && !w.contains(e.target)) { var dd = document.getElementById('notif-dropdown'); if (dd) dd.style.display = 'none'; } });
    // renderNotificaciones / leerNotif / marcarTodasLeidas: usa supabase.js

</script>
    </div>
</body>
</html>
